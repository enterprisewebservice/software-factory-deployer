# Per-seat limited-admin identities (Dean, 2026-08-25): admin-userN is a
# namespace-scoped operator persona — full admin inside userN-agent-
# workspace, no grants anywhere else, NOT in the Keycloak attendees
# group (so no Dev Hub catalog membership, no gitea hire routing).
# htpasswd entries live in the workshop-users-htpasswd Secret (same
# workshop password; imperative companion like the seats), User objects
# pre-created for stable UIDs, Groups named like the user so any
# groups-claim policy rows match (the ArgoCD lesson).
---
