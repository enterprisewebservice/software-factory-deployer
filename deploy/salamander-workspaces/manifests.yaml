# SUPPLY-CHAIN LANE (module 6, live 2026-08-27) — per-seat substrate applied
# imperatively alongside this file (fold into manifests at next revision):
#   * Secret pac-gitea-webhook (random) per seat ns — PaC webhook secret
#   * Secret quay-push-secret copied from agent-office + linked to the
#     'pipeline' SA (build pushes)
#   * ORG-level gitea webhook per <user>-agents org -> PaC controller route
#     (push + pull_request), secret = pac-gitea-webhook
#   * SYSTEM-level gitea webhook (admin/hooks, fires for every repo) ->
#     OpenShift GitOps webhook endpoint
#     https://openshift-gitops-server-openshift-gitops.apps.<domain>/api/webhook
#     (push, json). Without it Argo only polls git every 3 min; the workshop
#     promises merge->sync "within seconds" (Module 2). Create once per cluster:
#     POST {gitea}/api/v1/admin/hooks  (admin basic auth)
#     {"type":"gitea","active":true,"events":["push"],
#      "config":{"url":"<argo-route>/api/webhook","content_type":"json"}}
#   * ConfigMap chains-public-key per seat ns (Tekton Chains cosign.pub;
#     key generated 2026-08-27 into openshift-pipelines/signing-secrets)
#   * ApplicationSet seat-services-gitea (seat-services-appset.yaml) —
#     promotion lane; AppProject agent-office sourceRepos widened to
#     gitea <org>/* (agent-office repo cluster/agent-office-appproject.yaml)
# Per-REPO piece (attendee-applied in module 6): PaC Repository CR.
# Per-seat agent workspaces (Dean, 2026-08-25: "they will need a workspace
# with their username in it"). One namespace per attendee, <user>-agent-workspace:
#   * labeled for OpenShift GitOps management (the instance gets RBAC there,
#     so the per-org ApplicationSet can deploy attendee agent repos into it);
#   * RoleBinding: the attendee administers their own workspace (watch pods,
#     read logs — Module 2/3 beats — without seeing anyone else's);
#   * ExternalSecret: the workspace-local copy of the Codex subscription
#     credential that a hire's own AgentGateway mounts
#     (codexCredentialsSecretRef is namespace-local). Synced from the same
#     Vault path as agent-office's copy, so a Dev Hub re-auth heals every
#     workspace at once.
# Scaling seats = appending a block; the keycloak_users stage generates the
# same shape on workshop clusters.
#
# IMPERATIVE COMPANION (secrets never live in git): each workspace also
# needs the registry pull credential the operator's gateway deployments
# reference (imagePullSecrets: quay-pull-secret) — copy it from
# agent-office into every seat namespace:
#   oc get secret quay-pull-secret -n agent-office -o yaml | <re-namespace> | oc apply
# (found live 2026-08-25: first workspace hire ImagePullBackOff.)
#
# MATTERMOST SEATS (imperative, same reason): each seat needs a local
# Mattermost account (username userN, the shared workshop password,
# joined to team "agents") — Team edition has no OIDC, so these are
# API-created. Chat provisioning (private channel + owner invite,
# operator >= v1.7.44) is opted in DECLARATIVELY since v1.7.56: the
# namespace label agentoffice.ai/chat-provisioning: "enabled" (on the
# Namespace blocks below) makes the operator use the ONE
# mattermost-admin-token Secret in ITS OWN namespace
# (agent-office-operator; copy it there from agent-office, imperative).
# The old per-seat replication of that Secret is RETIRED — it parked a
# Mattermost ADMIN credential inside tenant reach, which Module 3's
# oc-get-secrets step surfaced live. A namespace-local Secret still
# wins if present (legacy back-compat only; do not create new ones).
#
# GITEA SEAT TOKENS (imperative, same reason): the governed gitea-mcp
# backend (agent-office cluster/gitea-mcp) authenticates per seat by
# PASS-THROUGH — each hire's AgentGateway sends Authorization: Bearer
# ${GITEA_TOKEN}, resolved from Secret <user>-gitea-token (key
# GITEA_TOKEN) in that seat's workspace via the AW's
# spec.tools.mcpServers[].envFromSecret, so gitea_* tools act AS the
# seat's Gitea user (verified live 2026-08-25, user1).
#
# Since 2026-08-25 the seat credential is a self-expiring Gitea OAuth2
# ACCESS token (1h), not a re-minted PAT — the same lifecycle the
# platform's GitHub App identity runs. Per seat, one-time:
#   * a Gitea OAuth2 grant is bootstrapped against the shared platform
#     app `seat-agent-workspace` (agent-office/seat-oauth-client in Vault);
#   * its REFRESH token is written to Vault agent-office/<user>-gitea-oauth
#     — PLATFORM-HELD, never synced into a seat namespace;
#   * its ACCESS token is written to the EXISTING Vault path
#     agent-office/<user>-gitea-token (key GITEA_TOKEN), so the ESO +
#     operator delivery chain below is unchanged.
# The refresher CronJob (refresher.yaml, ns gitea, every 30m) keeps the
# access token fresh via the refresh_token grant — no seat password. The
# operator (>= v1.7.46) renders GITEA_TOKEN into the seat gateway's
# openclaw.json and the runtime HOT-RELOADS it, so a refresh reaches the
# agent with NO pod restart. Stop the refresher and the seat's access
# token dies within the hour (revocation by omission). The one-time grant
# bootstrap is the ONLY step needing the seat password — see refresher.yaml
# IMPERATIVE COMPANION #3 (run at provisioning, where keycloak_user_password
# is known, or as an admin Job from an out-of-band password Secret).
#
# Canonical per-seat Secrets still live in the gitea namespace (it always
# exists at provisioning; the seat workspaces may not yet) — copy each into
# its seat namespace:
#   oc get secret user1-gitea-token -n gitea -o yaml | <re-namespace> | oc apply
# Same flow for gitea-mcp-broker-token (gitea ns → agent-office): the
# broker's DISCOVERY credential for the gitea MCPServerRegistration
# (key AUTHORIZATION, label mcp.kuadrant.io/secret). The refresher UPDATES
# <user>-gitea-token in place every 30m — but ESO syncs each seat copy from
# Vault directly, so no manual re-replication is needed after a refresh
# (unlike the retired rotator's re-mint).
---
apiVersion: v1
kind: Namespace
metadata:
  name: user1-agent-workspace
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
    agentoffice.ai/chat-provisioning: "enabled"
    software-factory.redhat.com/seat: user1
    app.kubernetes.io/managed-by: software-factory-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user1-workspace-admin
  namespace: user1-agent-workspace
  labels:
    app.kubernetes.io/managed-by: software-factory-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: user1
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codex-subscription-credentials
  namespace: user1-agent-workspace
  labels:
    app.kubernetes.io/managed-by: software-factory-deployer
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: codex-subscription-credentials
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels:
          agentoffice.ai/credential: codex-subscription
          app.kubernetes.io/managed-by: software-factory-deployer
  data:
    - secretKey: auth.json
      remoteRef:
        key: codex-subscription-credentials
        property: auth.json
---
