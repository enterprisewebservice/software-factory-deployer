# Seat git credentials, Vault-backed (2026-08-25): the same lifecycle the
# platform's GitHub App identity uses — Vault is the source of truth,
# External Secrets Operator syncs each seat's ACCESS token into its
# workspace every minute, and the operator (>= v1.7.46) renders it into the
# seat gateway's openclaw.json where the runtime hot-reloads it — no pod
# roll. The token is a self-expiring Gitea OAuth2 access token, refreshed
# every 30m by the refresher CronJob (refresher.yaml, ns gitea) from a
# platform-held refresh token; stop refreshing and it dies within the hour.
# These ExternalSecrets sync only the access-token path — the refresh token
# stays in Vault (agent-office/<user>-gitea-oauth), never in a seat
# namespace. Module 3 walks this chain hop by hop.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user1-gitea-token
  namespace: user1-agent-workspace
  labels:
    app.kubernetes.io/managed-by: software-factory-deployer
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: user1-gitea-token
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: software-factory-deployer
          software-factory.redhat.com/seat: user1
  data:
    - secretKey: GITEA_TOKEN
      remoteRef:
        key: user1-gitea-token
        property: GITEA_TOKEN
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user2-gitea-token
  namespace: user2-agent-workspace
  labels:
    app.kubernetes.io/managed-by: software-factory-deployer
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: user2-gitea-token
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
