# OpenShift GitOps per-seat visibility (updated 2026-08-25 after the live
# subject-matching hunt).
#
# HOW ARGO MATCHES SUBJECTS HERE (proven live, not assumed): permission
# rows match the token's federated user id — which equals the OpenShift
# User object's .metadata.uid — and the groups claim. They do NOT match
# the name/preferred_username scopes (dpeterson's name-keyed admin row
# never fired; his access flows through the rhods-admins Group).
#
# Therefore every seat is keyed BOTH ways:
#   * by username  — matches via the per-seat OpenShift Group of the
#     same name (groups claim; requires a login AFTER group creation)
#   * by User UID  — matches the federated user id on any token
# Seat provisioning must PRE-CREATE the User objects (oc create user
# userN) so UIDs exist at provision time; first htpasswd/SSO login then
# maps the Identity onto the pre-created User, keeping the UID stable.
#
# Default is deny (role:none); admins keep role:admin via groups.
# Apply:
#   oc patch argocd openshift-gitops -n openshift-gitops --type=merge \
#     --patch-file deploy/salamander-workspaces/argocd-rbac-patch.yaml
spec:
  rbac:
    defaultPolicy: role:none
    scopes: '[groups, name]'
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, rhods-admins, role:admin
      g, dpeterson, role:admin
      p, user1, applications, get, agent-office/user1-agents-*, allow
      p, user1, applications, sync, agent-office/user1-agents-*, allow
      p, user1, projects, get, agent-office, allow
      p, d1922891-ae4d-4eaf-aa5b-be6a07c8c155, applications, get, agent-office/user1-agents-*, allow
      p, d1922891-ae4d-4eaf-aa5b-be6a07c8c155, applications, sync, agent-office/user1-agents-*, allow
      p, d1922891-ae4d-4eaf-aa5b-be6a07c8c155, projects, get, agent-office, allow
      p, user2, applications, get, agent-office/user2-agents-*, allow
      p, user2, applications, sync, agent-office/user2-agents-*, allow
      p, user2, projects, get, agent-office, allow
      p, 49689d4c-535c-4651-84c2-5686813a123a, applications, get, agent-office/user2-agents-*, allow
      p, 49689d4c-535c-4651-84c2-5686813a123a, applications, sync, agent-office/user2-agents-*, allow
      p, 49689d4c-535c-4651-84c2-5686813a123a, projects, get, agent-office, allow
      p, user3, applications, get, agent-office/user3-agents-*, allow
      p, user3, applications, sync, agent-office/user3-agents-*, allow
      p, user3, projects, get, agent-office, allow
      p, 1ed90d94-20fa-48d1-8970-3cfbfd5db147, applications, get, agent-office/user3-agents-*, allow
      p, 1ed90d94-20fa-48d1-8970-3cfbfd5db147, applications, sync, agent-office/user3-agents-*, allow
      p, 1ed90d94-20fa-48d1-8970-3cfbfd5db147, projects, get, agent-office, allow
      p, user4, applications, get, agent-office/user4-agents-*, allow
      p, user4, applications, sync, agent-office/user4-agents-*, allow
      p, user4, projects, get, agent-office, allow
      p, 0d07b887-91a7-4870-8ac1-ed2c7733906c, applications, get, agent-office/user4-agents-*, allow
      p, 0d07b887-91a7-4870-8ac1-ed2c7733906c, applications, sync, agent-office/user4-agents-*, allow
      p, 0d07b887-91a7-4870-8ac1-ed2c7733906c, projects, get, agent-office, allow
      p, user5, applications, get, agent-office/user5-agents-*, allow
      p, user5, applications, sync, agent-office/user5-agents-*, allow
      p, user5, projects, get, agent-office, allow
      p, 3c22a258-b53b-400f-8094-e64b16d8ae59, applications, get, agent-office/user5-agents-*, allow
      p, 3c22a258-b53b-400f-8094-e64b16d8ae59, applications, sync, agent-office/user5-agents-*, allow
      p, 3c22a258-b53b-400f-8094-e64b16d8ae59, projects, get, agent-office, allow
