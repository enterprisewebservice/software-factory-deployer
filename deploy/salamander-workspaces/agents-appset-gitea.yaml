# Agents ApplicationSet (gitea) — ALL FIVE seat orgs. Live copy of the
# deployer's agent-office-appset-gitea rendering; the original render
# covered only user1-agents (found live 2026-08-28: seats 2-5 hires
# published repos but never deployed). Milestone B: drive the j2 from
# the seat list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-office-agents-gitea
  namespace: openshift-gitops
spec:
  # A generator hiccup (GitHub 5xx on the pathsExist check, a Gitea blip)
  # makes an Application vanish for a minute; without this the app is
  # deleted WITH its finalizer and everything it created goes too —
  # 2026-09-04 that took the upstreambeat newsroom gateway, its PVC and
  # the desk's cron jobs. Resources now outlive the Application object.
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - scmProvider:
      cloneProtocol: https
      filters:
      - pathsExist:
        - argocd/applicationset-managed
        repositoryMatch: .*-(agent|autoresearch)-gitops$
      gitea:
        api: https://gitea-gitea.apps.salamander.aimlworkbench.com
        owner: user1-agents
        tokenRef:
          key: token
          secretName: agent-office-gitea-scm
      requeueAfterSeconds: 60
  - scmProvider:
      cloneProtocol: https
      filters:
      - pathsExist:
        - argocd/applicationset-managed
        repositoryMatch: .*-(agent|autoresearch)-gitops$
      gitea:
        api: https://gitea-gitea.apps.salamander.aimlworkbench.com
        owner: user2-agents
        tokenRef:
          key: token
          secretName: agent-office-gitea-scm
      requeueAfterSeconds: 60
  - scmProvider:
      cloneProtocol: https
      filters:
      - pathsExist:
        - argocd/applicationset-managed
        repositoryMatch: .*-(agent|autoresearch)-gitops$
      gitea:
        api: https://gitea-gitea.apps.salamander.aimlworkbench.com
        owner: user3-agents
        tokenRef:
          key: token
          secretName: agent-office-gitea-scm
      requeueAfterSeconds: 60
  - scmProvider:
      cloneProtocol: https
      filters:
      - pathsExist:
        - argocd/applicationset-managed
        repositoryMatch: .*-(agent|autoresearch)-gitops$
      gitea:
        api: https://gitea-gitea.apps.salamander.aimlworkbench.com
        owner: user4-agents
        tokenRef:
          key: token
          secretName: agent-office-gitea-scm
      requeueAfterSeconds: 60
  - scmProvider:
      cloneProtocol: https
      filters:
      - pathsExist:
        - argocd/applicationset-managed
        repositoryMatch: .*-(agent|autoresearch)-gitops$
      gitea:
        api: https://gitea-gitea.apps.salamander.aimlworkbench.com
        owner: user5-agents
        tokenRef:
          key: token
          secretName: agent-office-gitea-scm
      requeueAfterSeconds: 60
  template:
    metadata:
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/managed-by: agent-office-applicationset
      name: '{{ .organization }}-{{ trimSuffix "-gitops" .repository }}'
    spec:
      destination:
        namespace: '{{ trimSuffix "-agents" .organization }}-agent-workspace'
        server: https://kubernetes.default.svc
      project: agent-office
      source:
        path: overlays/development
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
