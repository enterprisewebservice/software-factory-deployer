# Seat user4's Showroom — rendered from deploy/salamander-showroom with the
# release token and user_data re-seated (the per-seat model: one instance
# per attendee, each built with its own identity at pod start).
apiVersion: v1
kind: Namespace
metadata:
  name: showroom-handsonmode
  labels:
    app.kubernetes.io/managed-by: software-factory-deployer
---
---
# Source: showroom-single-pod/templates/terminal/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom-handsonmode
  namespace: showroom-handsonmode
---
# Source: showroom-single-pod/templates/proxy/configmap-traefik-dynamic.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-handsonmode-traefik-dynamic
  namespace: showroom-handsonmode
data:
  dynamic.yml: |
    http:
      routers:
        showroom:
          rule: PathPrefix(`/`)
          entryPoints:
          - web
          service: showroom
          middlewares:
          - guide-no-cache
          priority: 1
        terminal:
          rule: PathPrefix(`/terminal`)
          entryPoints:
          - web
          service: terminal
          middlewares:
          - terminal-stripprefix
          priority: 10
        wetty:
          rule: PathPrefix(`/wetty`)
          entryPoints:
          - web
          service: wetty
          priority: 10
        redirect-com:
          rule: Host(`handsonmode.com`) || Host(`www.handsonmode.com`)
          entryPoints:
          - web
          middlewares:
          - to-canonical
          service: showroom
          priority: 100
      services:
        showroom:
          loadBalancer:
            servers:
            - url: http://127.0.0.1:8000
        terminal:
          loadBalancer:
            servers:
            - url: http://127.0.0.1:7681
        wetty:
          loadBalancer:
            servers:
            - url: http://127.0.0.1:8001
      middlewares:
        to-canonical:
          redirectRegex:
            regex: ^https?://(www\.)?handsonmode\.com/(.*)
            replacement: https://handsonmode.ai/${2}
            permanent: true
        guide-no-cache:
          headers:
            customResponseHeaders:
              Cache-Control: no-cache
        terminal-stripprefix:
          stripPrefix:
            prefixes:
            - /terminal
---
# Source: showroom-single-pod/templates/proxy/configmap-traefik-static.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-handsonmode-traefik-static
  namespace: showroom-handsonmode
data:
  traefik.yml: |
    api:
      dashboard: false
      insecure: false
    entryPoints:
      web:
        address: ":8080"
    ping:
      entryPoint: web
    providers:
      file:
        filename: /etc/traefik/dynamic.yml
        watch: false
    log:
      level: INFO
    accessLog: {}
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
---
# Hands-On Mode edition branding: replaces the terminal image's Red Hat
# login banner (mounted over /etc/motd.d/rhdp, which ~/.bashrc cats).
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-handsonmode-branding
  namespace: showroom-handsonmode
data:
  motd: |
    ----------------------------------------------------------------------------
                             Hands-On Mode  |  live seat
    ----------------------------------------------------------------------------

    This is a real shell on real infrastructure, scoped to your seat.
    Follow the course guide on the left. Anything you break, resets.

                                                              handsonmode.ai
    ----------------------------------------------------------------------------
---
# Source: showroom-single-pod/templates/proxy/configmap-user-data.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-handsonmode-userdata
  namespace: showroom-handsonmode
data:
  user_data.yml: |
    user: preview
    password: ask-your-instructor
    openshift_console_url: https://console-openshift-console.apps.salamander.aimlworkbench.com
    openshift_api_url: https://api.salamander.aimlworkbench.com:6443
    devhub_url: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com
    gitops_url: https://openshift-gitops-server-openshift-gitops.apps.salamander.aimlworkbench.com
    mattermost_url: https://mattermost-mattermost.apps.salamander.aimlworkbench.com
    ocp_version: "4.21"
---
# Source: showroom-single-pod/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: showroom-handsonmode-terminal-lab-user-home
  namespace: showroom-handsonmode
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
# Source: showroom-single-pod/templates/terminal/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-showroom-handsonmode-sa
  namespace: showroom-handsonmode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: showroom-handsonmode
  namespace: showroom-handsonmode
---
# Source: showroom-single-pod/templates/proxy/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: showroom-handsonmode
  namespace: showroom-handsonmode
spec:
  type: ClusterIP
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: showroom-handsonmode
---
# Source: showroom-single-pod/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-handsonmode
  namespace: showroom-handsonmode
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-handsonmode
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showroom-handsonmode
      annotations:
        checksum/traefik-static: a8de5299f7b2966e2852965185fbb2d4ffb2cc45860a59c4d61cac3b9e13214b
        checksum/traefik-dynamic: a02b0cc4b3df4346cc2c3a3fac2523acc477f0837e34b329349c36815722dec3
        checksum/userdata: 26bb9f7c2651a5737ef2c053c8806b5def0ec4e4f85135c1300fad5f7b649030
    spec:
      serviceAccountName: showroom-handsonmode
      initContainers:
      - name: git-cloner
        image: "quay.io/rhpds/git-cloner:v1.1.5"
        env:
        - name: GIT_REPO_URL
          value: "https://github.com/enterprisewebservice/showroom-openshift-software-factory.git"
        - name: GIT_REPO_REF
          value: "main"
        - name: CLONE_DIR
          value: "/showroom/repo"
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-handsonmode-files
          subPath: repo
      - name: antora-builder
        image: "quay.io/rhpds/antora:v1.3.0"
        env:
        - name: FILES_DIR
          value: "/showroom/repo"
        - name: OUTPUT_DIR
          value: "/showroom/www"
        - name: ANTORA_SITE_FILE
          value: "site-handsonmode.yml"
        - name: ANTORA_ENABLE_DEV_MODE
          value: "false"
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-handsonmode-files
          subPath: repo
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/www
          name: showroom-handsonmode-files
          subPath: www
      containers:
      - name: traefik
        image: "quay.io/rhpds/traefik:v3.7.9"
        imagePullPolicy: "IfNotPresent"
        args:
        - "--configFile=/etc/traefik/traefik.yml"
        volumeMounts:
        - mountPath: /etc/traefik/traefik.yml
          name: traefik-static
          subPath: traefik.yml
          readOnly: true
        - mountPath: /etc/traefik/dynamic.yml
          name: traefik-dynamic
          subPath: dynamic.yml
          readOnly: true
        ports:
        - name: web
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi

      - name: content
        image: "quay.io/rhpds/showroom-content:v1.4.2"
        imagePullPolicy: "IfNotPresent"
        env:
        - name: GIT_REPO_URL
          value: "https://github.com/enterprisewebservice/showroom-openshift-software-factory.git"
        - name: GIT_REPO_REF
          value: "main"
        - name: ANTORA_PLAYBOOK
          value: "site-handsonmode.yml"
        # Hands-On Mode edition: brand-patched copy of the upstream nookbag
        # release (favicon + title — upstream hardcodes demo.redhat.com with
        # no config hook). Ships in the workshop repo, already cloned into
        # the pod by git-cloner; derivation: ui-handsonmode/build-nookbag-bundle.sh.
        - name: ZT_BUNDLE
          value: "file:///showroom/repo/ui-handsonmode/nookbag-handsonmode-v0.4.0.zip"
        - name: ZT_UI_ENABLED
          value: "true"
        - name: SHOWROOM_UI_CONFIG
          value: ""
        - name: DOMAIN
          value: "apps.salamander.aimlworkbench.com"
        - name: GUID
          value: "dev01"
        - name: USER
          value: "dean"
        volumeMounts:
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/repo
          name: showroom-handsonmode-files
          subPath: repo
        - mountPath: /showroom/www
          name: showroom-handsonmode-files
          subPath: www
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      - name: terminal
        image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
        imagePullPolicy: "IfNotPresent"
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GUID
          value: "dev01"
        volumeMounts:
        - name: terminal-lab-user-home
          mountPath: /home/lab-user
        - name: terminal-data-ssh # to enable ssh out of the container
          mountPath: /data/.ssh
        # Hands-On Mode edition: shadow the image's Red Hat login banner
        # (~lab-user/.bashrc cats this exact path).
        - name: branding
          mountPath: /etc/motd.d/rhdp
          subPath: motd
        ports:
        - containerPort: 7681
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - name: wetty
        image: "quay.io/rhpds/wetty:v3.2.1"
        imagePullPolicy: "IfNotPresent"
        args:
        - --base="/wetty/"
        - --port=8001
        - --allow-iframe=true
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GUID
          value: "dev01"
        ports:
        - containerPort: 8001
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 256Mi

      volumes:
      - name: showroom-handsonmode-files
        emptyDir: {}
      - name: user-data
        configMap:
          name: showroom-handsonmode-userdata
      - name: traefik-static
        configMap:
          name: showroom-handsonmode-traefik-static
      - name: traefik-dynamic
        configMap:
          name: showroom-handsonmode-traefik-dynamic
      - name: terminal-data-ssh # to enable ssh out of the container
        emptyDir: {}
      - name: terminal-lab-user-home
        persistentVolumeClaim:
          claimName: showroom-handsonmode-terminal-lab-user-home
      - name: branding
        configMap:
          name: showroom-handsonmode-branding
---
# Source: showroom-single-pod/templates/proxy/route.yaml
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: showroom-handsonmode
  namespace: showroom-handsonmode
  annotations:
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  to:
    kind: Service
    name: showroom-handsonmode
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# Public domain wiring (DNS: Route 53 -> cluster edge). Same pattern as
# nl2sql.ai: an Ingress the router materializes as edge Routes, with the
# cert inlined from handsonmode-tls once cert-manager (letsencrypt-http01)
# issues it. The .com hosts route to the same pod, where traefik's
# redirect-com router 301s them to the canonical .ai.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: handsonmode-domain
  namespace: showroom-handsonmode
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    route.openshift.io/termination: edge
    haproxy.router.openshift.io/redirect-to-https: "true"
spec:
  ingressClassName: openshift-default
  tls:
    - hosts: [handsonmode.ai, www.handsonmode.ai, handsonmode.com, www.handsonmode.com]
      secretName: handsonmode-tls
  rules:
    - host: handsonmode.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: handsonmode-hub
                port: { number: 8080 }
    - host: www.handsonmode.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: handsonmode-hub
                port: { number: 8080 }
    - host: handsonmode.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: handsonmode-hub
                port: { number: 8080 }
    - host: www.handsonmode.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: handsonmode-hub
                port: { number: 8080 }
