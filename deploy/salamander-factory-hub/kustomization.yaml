apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory-hub
resources:
  - manifests.yaml
  - manifests-rbac.yaml
# Page content ships as ConfigMaps generated from the real files; after
# editing, `oc apply -k deploy/salamander-factory-hub` then
# `oc rollout restart deployment/factory-hub -n factory-hub`.
configMapGenerator:
  - name: factory-hub-site
    files:
      - landing.html=files/landing.html
      - mylab.html=files/mylab.html
      - admin.html=files/admin.html
  - name: factory-hub-broker
    files:
      - broker.py=files/broker.py
      - seatlib.py=files/seatlib.py
  - name: factory-hub-scripts
    files:
      - provision-seat.py=files/provision-seat.py
      - deprovision-seat.py=files/deprovision-seat.py
      - seatlib.py=files/seatlib.py
      - reset-seat.sh=files/reset-seat.sh
      - reset-entry.sh=files/reset-entry.sh
      - seat-showroom.yaml=files/seat-showroom.yaml
      - seat-policy.yaml=files/seat-policy.yaml
  - name: factory-hub-assets
    files:
      - favicon.svg=files/favicon.svg
      - favicon.png=files/favicon.png
generatorOptions:
  disableNameSuffixHash: true
