# Per-seat policy, applied by the provisioner with __HANDLE__/__USERNAME__ filled in.
# The workspace: the person (real SSO identity) AND the seat's terminal
# ServiceAccount are admins of it; nothing else is granted anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seat-user-admin
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects:
  - { kind: User, apiGroup: rbac.authorization.k8s.io, name: "__USERNAME__" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seat-terminal-admin
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects:
  - { kind: ServiceAccount, name: showroom-__HANDLE__, namespace: showroom-__HANDLE__ }
---
# The seat's own hostname is guarded by an oauth-proxy sidecar whose
# SubjectAccessReview is "get services in showroom-<handle>": this
# binding is what admits the owner (cluster admins pass any SAR).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seat-owner-view
  namespace: showroom-__HANDLE__
  labels: { app.kubernetes.io/managed-by: factory-hub }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view }
subjects:
  - { kind: User, apiGroup: rbac.authorization.k8s.io, name: "__USERNAME__" }
---
# No cluster-scoped read on ModelConnections: the operator projects the
# brains this seat may hire on into its workspace as ModelConnectionOffers
# (Module 7 lists those), and renders no connection the seat was not offered.
# The agent gateway mounts its skills as an OCI image volume, which the
# cluster's SCCs forbid unless the pod's ServiceAccount may `use` the
# agent-office-imagevol SCC. The fixed workshop seats get this from
# agent-office/cluster/skills-scc; a dynamic seat gets it here. Without
# it every hire sits in Pending ("unable to validate against any SCC").
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-office-imagevol-default-sa
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: use-agent-office-imagevol-scc }
subjects:
  - { kind: ServiceAccount, name: default, namespace: __HANDLE__-agent-workspace }
---
# The chat bridge (agent-office/mm-bridge) relays Mattermost messages to
# the seat's agents by exec-ing into their gateway pods; it discovers the
# seat by the agentoffice.ai/managed label and needs this access here.
# The deployer gives the fixed seats an equivalent namespaced Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mm-bridge
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mm-bridge-seat }
subjects:
  - { kind: ServiceAccount, name: mm-bridge, namespace: agent-office }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: seat-quota
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
spec:
  hard:
    pods: "60"
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: "10"
    requests.storage: 60Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: seat-limits
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
spec:
  limits:
    - type: Container
      default: { cpu: "1", memory: 2Gi }
      defaultRequest: { cpu: 100m, memory: 256Mi }
      # Sized for the golden-path build (buildah step: 4.6 CPU / 8Gi; the
      # pod sums its steps to ~6.5 CPU / 16.5Gi) plus the fan-out of scans.
      max: { cpu: "8", memory: 16Gi }
---
# Seats cannot talk to each other. Allowlist = same namespace + every
# namespace that is NOT a seat (platform services, ingress, operators).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seat-isolation
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - { key: factory-hub.redhat.com/seat, operator: DoesNotExist }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codex-subscription-credentials
  namespace: __HANDLE__-agent-workspace
  labels: { app.kubernetes.io/managed-by: factory-hub }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-cluster }
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: codex-subscription-credentials
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels:
          agentoffice.ai/credential: codex-subscription
          app.kubernetes.io/managed-by: factory-hub
  data:
    - secretKey: auth.json
      remoteRef: { key: codex-subscription-credentials, property: auth.json }
