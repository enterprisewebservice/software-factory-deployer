apiVersion: v1
kind: Namespace
metadata:
  name: showroom-__USER__
  labels:
    app.kubernetes.io/managed-by: software-factory-deployer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom-__USER__
  namespace: showroom-__USER__
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"showroom-__USER__"}}'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-__USER__-traefik-dynamic
  namespace: showroom-__USER__
data:
  dynamic.yml: "http:\n  routers:\n    showroom:\n      rule: \"PathPrefix(`/`)\"\n      entryPoints:\n        - web\n      service: showroom\n      middlewares:\n        - guide-no-cache\n      priority: 1\n    terminal:\n      rule: \"PathPrefix(`/terminal`)\"\n      entryPoints:\n        - web\n      service: terminal\n      middlewares:\n        - terminal-stripprefix\n      priority: 10\n    wetty:\n      rule: \"PathPrefix(`/wetty`)\"\n      entryPoints:\n        - web\n      service: wetty\n      priority: 10\n\n  services:\n    showroom:\n      loadBalancer:\n        servers:\n          - url: \"http://127.0.0.1:8000\"\n    terminal:\n      loadBalancer:\n        servers:\n          - url: \"http://127.0.0.1:7681\"\n    wetty:\n      loadBalancer:\n        servers:\n          - url: \"http://127.0.0.1:8001\"\n  middlewares:\n    # Guide content must always revalidate: the nookbag viewer fetches\n    # module HTML that is otherwise served cache-control:private with no\n    # max-age,\
    \ and browser heuristic caching keeps attendees on stale\n    # pages after content updates. no-cache still allows 304 revalidation,\n    # so rebuilds become visible on a plain reload.\n    guide-no-cache:\n      headers:\n        customResponseHeaders:\n          Cache-Control: \"no-cache\"\n    terminal-stripprefix:\n      stripPrefix:\n        prefixes:\n          - \"/terminal\"\n"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-__USER__-traefik-static
  namespace: showroom-__USER__
data:
  traefik.yml: "api:\n  dashboard: false\n  insecure: false\nentryPoints:\n  web:\n    address: \":8080\"\nping:\n  entryPoint: web\nproviders:\n  file:\n    filename: /etc/traefik/dynamic.yml\n    watch: false\nlog:\n  level: INFO\naccessLog: {}\nglobal:\n  checkNewVersion: false\n  sendAnonymousUsage: false\n"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-__USER__-userdata
  namespace: showroom-__USER__
data:
  user_data.yml: 'user: __USER__

    password: __PASSWORD__

    openshift_console_url: https://console-openshift-console.apps.salamander.aimlworkbench.com

    openshift_api_url: https://api.salamander.aimlworkbench.com:6443

    devhub_url: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com

    gitops_url: https://openshift-gitops-server-openshift-gitops.apps.salamander.aimlworkbench.com

    mattermost_url: https://mattermost-mattermost.apps.salamander.aimlworkbench.com/oauth/gitlab/login?redirect_to=%2F

    ocp_version: "4.21"

    '

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: showroom-__USER__-terminal-lab-user-home
  namespace: showroom-__USER__
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-showroom-__USER__-sa
  namespace: showroom-__USER__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: showroom-__USER__
  namespace: showroom-__USER__

---
apiVersion: v1
kind: Service
metadata:
  name: showroom-__USER__
  namespace: showroom-__USER__
spec:
  type: ClusterIP
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 4180
    name: proxy
  selector:
    app.kubernetes.io/name: showroom-__USER__

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-__USER__
  namespace: showroom-__USER__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-__USER__
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showroom-__USER__
      annotations:
        checksum/traefik-static: a8de5299f7b2966e2852965185fbb2d4ffb2cc45860a59c4d61cac3b9e13214b
        checksum/traefik-dynamic: a02b0cc4b3df4346cc2c3a3fac2523acc477f0837e34b329349c36815722dec3
        checksum/userdata: 26bb9f7c2651a5737ef2c053c8806b5def0ec4e4f85135c1300fad5f7b649030
    spec:
      serviceAccountName: showroom-__USER__
      initContainers:
      - name: git-cloner
        image: quay.io/rhpds/git-cloner:v1.1.5
        env:
        - name: GIT_REPO_URL
          value: https://github.com/enterprisewebservice/showroom-openshift-software-factory.git
        - name: GIT_REPO_REF
          value: main
        - name: CLONE_DIR
          value: /showroom/repo
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-__USER__-files
          subPath: repo
      - name: antora-builder
        image: quay.io/rhpds/antora:v1.3.0
        env:
        - name: FILES_DIR
          value: /showroom/repo
        - name: OUTPUT_DIR
          value: /showroom/www
        - name: ANTORA_SITE_FILE
          value: site.yml
        - name: ANTORA_ENABLE_DEV_MODE
          value: 'false'
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-__USER__-files
          subPath: repo
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/www
          name: showroom-__USER__-files
          subPath: www
      containers:
      - name: oauth-proxy
        image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:b8e3cc632ec7ee136b1b9296acf51b796c7eefb007f2613ade15ae50ec94d04e
        args:
        - --https-address=
        - --http-address=0.0.0.0:4180
        - --provider=openshift
        - --openshift-service-account=showroom-__USER__
        - --login-url=https://oauth-openshift.apps.salamander.aimlworkbench.com/oauth/authorize?idp=factory-sso
        - --upstream=http://127.0.0.1:8080
        - --cookie-secret-file=/etc/proxy/secrets/cookie-secret
        - --cookie-expire=8h0m0s
        - --cookie-refresh=1h0m0s
        - --openshift-sar={"namespace":"showroom-__USER__","resource":"services","verb":"get"}
        - --skip-provider-button=true
        - --pass-user-headers=true
        - --pass-basic-auth=false
        ports:
        - containerPort: 4180
          name: proxy
        volumeMounts:
        - name: proxy-secrets
          mountPath: /etc/proxy/secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /oauth/healthz
            port: 4180
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - name: traefik
        image: quay.io/rhpds/traefik:v3.7.9
        imagePullPolicy: IfNotPresent
        args:
        - --configFile=/etc/traefik/traefik.yml
        volumeMounts:
        - mountPath: /etc/traefik/traefik.yml
          name: traefik-static
          subPath: traefik.yml
          readOnly: true
        - mountPath: /etc/traefik/dynamic.yml
          name: traefik-dynamic
          subPath: dynamic.yml
          readOnly: true
        ports:
        - name: web
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
      - name: content
        image: quay.io/rhpds/showroom-content:v1.4.2
        imagePullPolicy: IfNotPresent
        env:
        - name: GIT_REPO_URL
          value: https://github.com/enterprisewebservice/showroom-openshift-software-factory.git
        - name: GIT_REPO_REF
          value: main
        - name: ANTORA_PLAYBOOK
          value: site.yml
        - name: ZT_BUNDLE
          value: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip
        - name: ZT_UI_ENABLED
          value: 'true'
        - name: SHOWROOM_UI_CONFIG
          value: ''
        - name: DOMAIN
          value: apps.salamander.aimlworkbench.com
        - name: GUID
          value: dev01
        - name: USER
          value: dean
        volumeMounts:
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/repo
          name: showroom-__USER__-files
          subPath: repo
        - mountPath: /showroom/www
          name: showroom-__USER__-files
          subPath: www
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      - name: terminal
        image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GUID
          value: dev01
        volumeMounts:
        - name: terminal-lab-user-home
          mountPath: /home/lab-user
        - name: terminal-data-ssh
          mountPath: /data/.ssh
        ports:
        - containerPort: 7681
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - name: wetty
        image: quay.io/rhpds/wetty:v3.2.1
        imagePullPolicy: IfNotPresent
        args:
        - --base="/wetty/"
        - --port=8001
        - --allow-iframe=true
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GUID
          value: dev01
        ports:
        - containerPort: 8001
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: showroom-__USER__-files
        emptyDir: {}
      - name: user-data
        configMap:
          name: showroom-__USER__-userdata
      - name: traefik-static
        configMap:
          name: showroom-__USER__-traefik-static
      - name: traefik-dynamic
        configMap:
          name: showroom-__USER__-traefik-dynamic
      - name: terminal-data-ssh
        emptyDir: {}
      - name: terminal-lab-user-home
        persistentVolumeClaim:
          claimName: showroom-__USER__-terminal-lab-user-home
      - name: proxy-secrets
        secret:
          secretName: showroom-__USER__-proxy

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: showroom-__USER__
  namespace: showroom-__USER__
  annotations:
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  to:
    kind: Service
    name: showroom-__USER__
  port:
    targetPort: 4180
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
