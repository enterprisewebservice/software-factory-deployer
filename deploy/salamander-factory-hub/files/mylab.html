<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your workbench — Red Hat Software Factory</title>
<link rel="icon" type="image/svg+xml" href="/hub/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="180x180" href="/hub/assets/favicon.png">
<link rel="apple-touch-icon" href="/hub/assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;700&display=swap">
<style>
  :root { --rh-red:#ee0000; --ink:#151515; --muted:#4d4d4d; --line:#e0e0e0; --bg:#f2f2f2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Red Hat Text",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  .nav { background:#000; color:#fff; } .nav-in { max-width:960px; margin:0 auto; padding:0.7rem 1.5rem; display:flex; align-items:center; gap:0.9rem; }
  .logo { display:flex; align-items:baseline; gap:0.6rem; font-family:"Red Hat Display",sans-serif; font-weight:900; font-size:1.15rem; text-decoration:none; color:#fff; }
  .logo .mark { width:0.85rem; height:1.35rem; background:var(--rh-red); border-radius:2px; transform:skewX(-8deg); display:inline-block; }
  .logo .thin { font-weight:400; color:#c7c7c7; } .spacer { flex:1; } .who { font-size:0.85rem; color:#c7c7c7; } .who b { color:#fff; }
  .btn { display:inline-block; border:0; border-radius:4px; background:var(--rh-red); color:#fff; padding:0.55rem 1.2rem; font:600 0.9rem "Red Hat Text",sans-serif; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#c00; } .btn.ghost { background:transparent; border:1px solid #5a5a5a; color:#fff; } .btn.dark { background:#151515; } .btn.outline { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn[disabled] { opacity:0.5; cursor:default; }
  /* the hidden attribute must win over .btn's display — the Admin link is
     hidden until /api/seat says admin:true, for everyone else it stays hidden */
  [hidden] { display:none !important; }
  main { max-width:960px; margin:0 auto; padding:2rem 1.5rem 3rem; }
  h1 { font-family:"Red Hat Display",sans-serif; font-weight:900; font-size:1.8rem; }
  .sub { color:var(--muted); margin-top:0.3rem; }
  .panel { background:#fff; border:1px solid var(--line); border-top:5px solid var(--rh-red); border-radius:8px; padding:1.4rem 1.5rem; margin-top:1.3rem; }
  .panel h2 { font-family:"Red Hat Display",sans-serif; font-size:1.15rem; font-weight:700; margin-bottom:0.6rem; }
  .spin { width:22px; height:22px; border:3px solid #ddd; border-top-color:var(--rh-red); border-radius:50%; animation:s .9s linear infinite; display:inline-block; vertical-align:middle; margin-right:0.5rem; }
  @keyframes s { to { transform:rotate(360deg); } }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:0.7rem; margin-top:0.6rem; }
  .link { border:1px solid var(--line); border-radius:6px; padding:0.7rem 0.9rem; text-decoration:none; color:inherit; display:block; }
  .link:hover { border-color:#999; } .link b { display:block; font-size:0.95rem; } .link span { color:var(--muted); font-size:0.8rem; }
  .cred { display:flex; align-items:center; gap:0.6rem; margin-top:0.5rem; font-size:0.95rem; }
  code { font-family:"Red Hat Mono",monospace; background:#f2f2f2; border:1px solid var(--line); border-radius:4px; padding:0.15rem 0.5rem; }
  .muted { color:var(--muted); font-size:0.88rem; line-height:1.5; }
  .err { background:#fdecea; border-left:4px solid var(--rh-red); padding:0.8rem 1rem; border-radius:4px; }
  .row { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:1rem; }
  .step { display:flex; gap:0.6rem; align-items:center; padding:0.35rem 0; color:var(--muted); }
  .step.done { color:var(--ink); } .step .dot { width:10px; height:10px; border-radius:50%; background:#ccc; } .step.done .dot { background:#1a7f37; } .step.now .dot { background:var(--rh-red); }
  /* Hands-On Mode edition of these pages (set by the brand layer from the hostname):
     the library's palette — blue accent, navy ink, cool grey ground. */
  html[data-brand="handsonmode"] { --rh-red:#246BFE; --ink:#13233D; --bg:#f7f9fc; --line:#e4e9f2; }
  html[data-brand="handsonmode"] .btn { background:#246BFE; } html[data-brand="handsonmode"] .btn:hover { background:#1b55d0; }
  html[data-brand="handsonmode"] .btn.dark { background:#13233D; }
  html[data-brand="handsonmode"] .nav { background:#ffffff; color:#13233D; border-bottom:1px solid #e4e9f2; }
  html[data-brand="handsonmode"] .nav .who, html[data-brand="handsonmode"] .nav .who * { color:#13233D; }
  html[data-brand="handsonmode"] .nav a:not(.btn) { color:#13233D; }
  html[data-brand="handsonmode"] .btn.ghost { color:#13233D; border-color:#13233D; }
  html[data-brand="handsonmode"] .logo img { height:1.5rem; vertical-align:middle; display:block; }
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="logo" href="/"><span class="mark"></span> Red&nbsp;Hat <span class="thin">Software Factory</span></a>
  <span class="spacer"></span><span class="who" id="who"></span>
  <a class="btn ghost" id="adminLink" href="/hub/admin.html" hidden>Admin</a>
  <a class="btn ghost" href="/oauth/sign_out" onclick="switchUser(event)">Sign out / switch user</a>
</div></nav>
<main>
  <h1>Your workbench</h1>
  <div class="sub">AI Agents as Staff — the OpenShift Software Factory</div>
  <div id="view" class="panel"><span class="spin"></span> Checking your workbench…</div>
</main>
<script>
const view = document.getElementById('view');
const STEPS = ['tooling','seat record','email from keycloak','keycloak attendees group (routes hires to Gitea)','seat password (mattermost + gitea local accounts)','openshift user + groups','workspace namespace + policy','operator discovery label','gitea user + org','gitea seat token (agent gateway)','argo applicationset generators','argo rbac rows','mattermost account','seat showroom','mark ready'];
let timer = null;
// Session guard: a hub page can be shown from the browser cache after a
// sign-out, or outlive its session. Then every /api/* call comes back as a
// login redirect (302 to the OAuth server) instead of JSON, and fetch()
// rejects. Route that through sign-in once (cache-busting), and show a
// plain error if the second attempt still fails, instead of spinning forever.
function goSignIn(reason){
  const q = new URLSearchParams(location.search);
  if (q.has('signin')) {
    document.body.insertAdjacentHTML('afterbegin', '<div class="err" style="margin:1rem;padding:0.8rem;border-left:4px solid #c00">Your session ended and sign-in did not complete (' + String(reason||'error').replace(/[<>&]/g,'') + '). <a href="/">Return to the landing page</a> and sign in again.</div>');
    return;
  }
  location.replace(location.pathname + '?signin=' + Date.now());
}
window.addEventListener('unhandledrejection', e => goSignIn(e.reason && e.reason.message));
// Editions: the seat is rendered for the front door it was (re-)provisioned
// from. A seat provisioned before the second door existed has no brand
// recorded and is the Red Hat edition.
function doorBrand() { return /handsonmode\.(ai|com)$/.test(location.hostname) ? 'handsonmode' : 'redhat'; }
function seatBrand(data) { return data.brand || 'redhat'; }
function editionName(b) { return b === 'handsonmode' ? 'Hands-On Mode' : 'Red Hat'; }
function editionSwitch(data) { return seatBrand(data) !== doorBrand(); }
async function api(path, method='GET') { const r = await fetch(path, {method, credentials:'include', headers:{'Accept':'application/json'}}); const ct = r.headers.get('content-type') || ''; if (!ct.includes('json')) throw new Error('not signed in (' + r.status + ')'); return {ok:r.ok, status:r.status, data: await r.json().catch(()=>({}))}; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function render() {
  const {ok, data} = await api('/api/seat');
  if (!ok) { view.innerHTML = '<div class="err">Could not read your seat (' + esc(data.error||'error') + '). Reload, or sign in again from the <a href="/">landing page</a>.</div>'; return; }
  document.getElementById('who').innerHTML = 'Signed in as <b>' + esc(data.user) + '</b>';
  if (data.admin) document.getElementById('adminLink').hidden = false;
  clearTimeout(timer);
  if (data.phase === 'none') {
    view.innerHTML = '<span class="spin"></span> Claiming a workbench for you…';
    const r = await api('/api/seat/provision', 'POST');
    if (r.status === 429) { view.innerHTML = '<div class="err">' + esc(r.data.error) + '</div>'; return; }
    timer = setTimeout(render, 3000); return;
  }
  if (data.phase === 'provisioning' || data.phase === 'resetting') {
    const now = STEPS.indexOf(data.step||'');
    view.innerHTML = '<h2><span class="spin"></span>' + (data.phase === 'resetting' ? 'Resetting your workshop' : 'Setting up your workbench') + '</h2>'
      + '<div class="muted">Your own OpenShift project, agent workspace, git organization, chat account, and workshop instance. First time takes two to four minutes.</div>'
      + (data.phase === 'provisioning' ? '<div style="margin-top:0.8rem">' + STEPS.map((s,i)=>'<div class="step '+(i<now?'done':i===now?'now':'')+'"><span class="dot"></span>'+(i<now?'✓ ':'')+esc(s)+'</div>').join('') + '</div>' : '');
    timer = setTimeout(render, 5000); return;
  }
  if (data.phase === 'error') {
    view.innerHTML = '<div class="err"><b>Something went wrong at "' + esc(data.step) + '".</b><div class="muted">' + esc(data.detail||'') + '</div></div>'
      + '<div class="row"><button class="btn" id="retry">Try again</button><a class="btn outline" href="/">Back to library</a></div>'
      + '<div class="muted" style="margin-top:0.8rem">If it fails twice, tell your Red Hat host — they can reset your seat from the admin page.</div>';
    document.getElementById('retry').onclick = async () => { await api('/api/seat/provision','POST'); render(); };
    return;
  }
  // ready — but hold the door until Developer Hub knows this person is an
  // attendee (its Keycloak sync runs every minute); a hire before that
  // would publish to GitHub instead of their Gitea org.
  const L = data.links || {};
  const gate = data.devhub_ready === false;
  if (gate) timer = setTimeout(render, 5000);
  view.innerHTML = '<h2>Ready — workbench <code>' + esc(data.handle) + '</code></h2>'
    + (gate ? '<div class="muted"><span class="spin"></span>Finishing your Developer Hub registration (under a minute)…</div>' : '')
    + '<div class="row"><a class="btn" ' + (gate ? 'style="pointer-events:none;opacity:.5"' : '') + ' href="' + L.workshop + '">Enter the workshop →</a></div>'
    + '<div class="muted" style="margin-top:1rem">One login everywhere: Developer Hub, GitOps, the console, Gitea, and chat all sign in with the account you registered. On Gitea use the <b>Sign in with keycloak</b> button; the Mattermost link below signs you in automatically. Your workshop terminal is already signed in as your workbench service account.</div>'
    + '<div class="cred">Username: <code>' + esc(data.handle) + '</code></div>'
    + '<h2 style="margin-top:1.2rem">Your surfaces</h2><div class="grid">'
    + [['Developer Hub','hire and inspect agents',L.devhub],['OpenShift GitOps','watch the rollout',L.gitops],['OpenShift console','your project: '+esc(data.handle)+'-agent-workspace',L.console],['Mattermost','chat with your agent — this link signs you in',L.mattermost],['Gitea','your git organization',L.gitea]].map(([t,s,u])=>'<a class="link" href="'+u+'" target="_blank" rel="noopener"><b>'+t+'</b><span>'+s+'</span></a>').join('')
    + '</div><h2 style="margin-top:1.2rem">Start over</h2><div class="muted">Restart wipes every agent, repository, and catalog entry your workbench created and returns it to a fresh Module 1. Your login and workbench stay.</div>'
    + '<div class="row"><button class="btn dark" id="reset">Restart workshop</button>'
    + (editionSwitch(data) ? ' <button class="btn outline" id="rebuild">Rebuild for the ' + editionName(doorBrand()) + ' edition</button>' : '') + '</div>'
    + '<div class="muted" style="margin-top:0.5rem">Your seat is rendered as the ' + editionName(seatBrand(data)) + ' edition.'
    + (editionSwitch(data) ? ' You came in through ' + location.hostname + ': rebuild it to get the ' + editionName(doorBrand()) + ' edition (a couple of minutes; your workspace and repositories are kept).' : '') + '</div>';
  const rb = document.getElementById('rebuild');
  if (rb) rb.onclick = async () => { if (!confirm('Rebuild your seat for the ' + editionName(doorBrand()) + ' edition? Your workspace, repositories and agents are kept; the guide and terminal page are re-rendered.')) return; await api('/api/seat/provision','POST'); render(); };
  document.getElementById('reset').onclick = async () => { if (!confirm('Restart the workshop? Everything your workbench created will be deleted.')) return; await api('/api/seat/reset','POST'); render(); };
}
render();
</script>
<script>
// Sign out everywhere, so the next sign-in can be a different person.
// Four sessions are involved and the hub's own sign-out only ends the
// first: (1) the hub cookie, (2) the OpenShift OAuth server session,
// (3) the Keycloak SSO session that quietly re-signs the same user in,
// (4) the Gitea session that chat signs people in through.
// (2) is ended by a top-level POST to the OAuth server's /logout in a
// small popup (a first-party page, so its cleared cookie is honoured),
// which is closed again; (3) by Keycloak's RP-initiated logout, which
// asks the person to confirm and then returns to the front door.
function switchUser(ev){
  if (ev) ev.preventDefault();
  const apps = location.host.split('.').slice(1).join('.');
  const keycloak = 'https://auth.runtab.io/realms/factory/protocol/openid-connect/logout?client_id=factory-hub&post_logout_redirect_uri='
    + encodeURIComponent(location.origin + '/?switched=1');
  let pop = null;
  try {
    pop = window.open('', 'ocp-logout', 'width=420,height=200');
    if (pop) {
      const f = pop.document.createElement('form');
      f.method = 'POST'; f.action = 'https://oauth-openshift.' + apps + '/logout?then=/';
      pop.document.body.appendChild(f); f.submit();
      // (4) the Gitea session — chat (Mattermost) signs people in through
      // Gitea, whose session outlives everything else. Gitea accepts a
      // GET sign-out, so the same popup visits it next, then closes.
      setTimeout(() => { try { pop.location = 'https://gitea-gitea.' + apps + '/user/logout'; } catch (_) {} }, 1500);
      setTimeout(() => { try { pop.close(); } catch (_) {} }, 3200);
    }
  } catch (_) {}
  fetch('/oauth/sign_out', {credentials:'include', redirect:'manual'}).catch(() => {})
    .finally(() => setTimeout(() => { location.href = keycloak; }, pop ? 3300 : 0));
}
</script>
<script>
// Second front door: the same pages under handsonmode.ai wear that brand.
(function(){var h=location.hostname;if(!/handsonmode\.(ai|com)$/.test(h))return;
document.documentElement.dataset.brand="handsonmode";
document.title=document.title.replace("Red Hat Software Factory","Hands-On Mode");
document.querySelectorAll('link[rel~="icon"][type="image/svg+xml"]').forEach(function(l){l.href="/hub/favicon.svg?v=hom1";});
document.querySelectorAll('link[rel~="icon"][type="image/png"],link[rel="apple-touch-icon"]').forEach(function(l){l.href="/hub/favicon.png?v=hom1";});
document.querySelectorAll(".logo").forEach(function(e){e.innerHTML='<img src="/hub/hom-wordmark.svg" alt="Hands-On Mode">';});
document.querySelectorAll("*").forEach(function(e){if(e.children.length===0&&/your Red Hat host/.test(e.textContent))e.textContent=e.textContent.replace("your Red Hat host","your host");});})();
</script>
</body>
</html>
