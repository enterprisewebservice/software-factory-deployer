# =============================================================================
# Red Hat Software Factory hub — factory.apps.salamander.aimlworkbench.com
#
# The share-out front door for the agents-as-staff workshop. Three tiers:
#
#   PUBLIC   /  /hub/assets/*  the landing page — browse with no account
#   AUTH     /oauth/*          OpenShift oauth-proxy -> cluster OAuth -> Keycloak (factory-sso)
#   WORKSHOP on the seat's own hostname, guarded by its own oauth-proxy (SAR)
#
# oauth-proxy is the only ingress. It skip-auths the landing and its
# assets, runs the OIDC dance for everything else, and forwards the
# signed-in identity (X-Auth-Request-User / -Email) to the nginx
# backend. nginx serves the landing and reverse-proxies the workshop.
#
# PER-SEAT ROUTING (provisioner milestone): the gated location resolves
# the target showroom from the authenticated username —
# showroom-<user>.svc — so once a person's seat exists their own
# environment answers, and until then the holding page does. Today,
# before the provisioner lands, WORKSHOP_UPSTREAM points at the shared
# Red Hat showroom so the gate itself is provable end to end.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-hub-nginx
  namespace: factory-hub
data:
  nginx.conf: |
    error_log /dev/stderr;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      server {
        listen 8080 default_server;
        absolute_redirect off;
        root /opt/app-root/src;

        # -- public landing -------------------------------------------
        location = / { add_header Cache-Control "no-store" always; try_files /site/landing.html =404; }
        # Hub assets live under /hub/assets: Showroom's own shell loads
        # ./assets/index-*.js, so /assets/ must proxy to the seat, not us.
        location /hub/assets/ { alias /opt/app-root/src/assets/; }
        location = /favicon.ico { types { } default_type image/png; alias /opt/app-root/src/assets/favicon.png; }

        # -- signed-in hub pages + broker API --------------------------
        # no-store: a cached copy of a signed-in page outlives the session and
        # spins on "Checking your workbench" instead of going through sign-in.
        location /hub/ { add_header Cache-Control "no-store" always; alias /opt/app-root/src/site/; }
        location /api/ {
          add_header Cache-Control "no-store" always;
          proxy_pass http://127.0.0.1:9000;
          proxy_set_header X-Forwarded-User $http_x_forwarded_user;
          proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 60s;
        }

        # -- the workshop lives on the seat's OWN hostname ----------------
        # (guarded there by its own oauth-proxy + SubjectAccessReview).
        # The hub never proxies it: the door just leads to the workbench
        # page, which links to the seat. No Showroom path knowledge here.
        location ~ ^/workshop/ { return 302 /hub/mylab.html; }
      }

      # -- second front door: handsonmode.ai ------------------------------
      # Same hub, same broker, same seats. oauth-proxy passes the request
      # Host through, so nginx picks this block for the handsonmode.ai
      # hostnames. The public surfaces (landing, wordmark, favicon, practice
      # packs) come from the Hands-On Mode library pod — its own repo stays
      # the single source for that content — while /hub, /api and sign-in
      # are this hub's. The broker reads X-Forwarded-Host and records the
      # brand on the seat; the provisioner renders the seat's Showroom with
      # the Hands-On Mode edition of the same workshop repo.
      server {
        listen 8080;
        server_name handsonmode.ai www.handsonmode.ai handsonmode.com www.handsonmode.com;
        absolute_redirect off;
        root /opt/app-root/src;

        location = / {
          add_header Cache-Control "no-store" always;
          proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080;
          proxy_set_header Host $host;
        }
        location = /hub/favicon.svg { proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080; proxy_set_header Host $host; }
        location = /hub/hom-wordmark.svg { proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080; proxy_set_header Host $host; }
        # The hub pages' static <link rel=icon> fetches this path before any
        # script runs, and browsers cache favicons by URL: serve the Hands-On
        # Mode icon at the same path on this host, uncached.
        location = /hub/assets/favicon.svg {
          add_header Cache-Control "no-cache" always;
          proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080/hub/favicon.svg;
          proxy_set_header Host $host;
        }
        location = /hub/assets/favicon.png {
          add_header Cache-Control "no-cache" always;
          proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080/hub/favicon.png;
          proxy_set_header Host $host;
        }
        location = /favicon.ico { proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080/favicon.ico; proxy_set_header Host $host; }
        location = /hub/favicon.png { proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080; proxy_set_header Host $host; }
        location = /drills { return 302 /drills/ex267/; }
        location /drills/ {
          proxy_pass http://handsonmode-hub.showroom-handsonmode.svc.cluster.local:8080;
          proxy_set_header Host $host;
        }

        location /hub/assets/ { alias /opt/app-root/src/assets/; }
        location /hub/ {
          add_header Cache-Control "no-store" always;
          alias /opt/app-root/src/site/;
          # Safari caches favicons by URL for the whole site: the pages served on
          # this host must never reference the asset paths that once carried the
          # Red Hat icon here — rewrite them to the library's icons, new URLs.
          sub_filter '/hub/assets/favicon.svg' '/hub/favicon.svg?v=hom1';
          sub_filter '/hub/assets/favicon.png' '/hub/favicon.png?v=hom1';
          sub_filter_once off;
        }
        location /api/ {
          add_header Cache-Control "no-store" always;
          proxy_pass http://127.0.0.1:9000;
          proxy_set_header X-Forwarded-User $http_x_forwarded_user;
          proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 60s;
        }
        location ~ ^/workshop/ { return 302 /hub/mylab.html; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-hub
  namespace: factory-hub
  labels: { app: factory-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: factory-hub } }
  template:
    metadata:
      labels: { app: factory-hub }
    spec:
      containers:
        # --- the auth gate: OpenShift oauth-proxy (release payload image) --
        # Delegates to the cluster OAuth server, which federates to Keycloak
        # (factory-sso, OIDC, mappingMethod add). The idp hint skips the
        # provider chooser, so an anonymous click lands on Keycloak's own
        # sign-in/register page. The signed-in OpenShift username reaches
        # nginx/broker as X-Forwarded-User.
        - name: oauth-proxy
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:b8e3cc632ec7ee136b1b9296acf51b796c7eefb007f2613ade15ae50ec94d04e
          args:
            - --https-address=
            - --http-address=0.0.0.0:4180
            - --provider=openshift
            - --openshift-service-account=factory-hub
            - --login-url=https://oauth-openshift.apps.salamander.aimlworkbench.com/oauth/authorize?idp=factory-sso
            - --upstream=http://127.0.0.1:8080
            - --cookie-secret-file=/etc/proxy/secrets/cookie-secret
            - --cookie-expire=8h0m0s
            - --cookie-refresh=1h0m0s
            - --pass-user-headers=true
            - --pass-basic-auth=false
            # Browse with no account: the landing and its assets are open.
            - --skip-auth-regex=^/$
            - --skip-auth-regex=^/hub/assets/
            # handsonmode.ai's public surfaces (library landing assets + practice packs)
            - --skip-auth-regex=^/hub/(favicon|hom-wordmark)\.svg$
            - --skip-auth-regex=^/hub/favicon\.png$
            - --skip-auth-regex=^/favicon\.ico$
            - --skip-auth-regex=^/drills(/|$)
            - --skip-provider-button=true
          ports: [{ containerPort: 4180 }]
          volumeMounts:
            - { name: proxy-secrets, mountPath: /etc/proxy/secrets, readOnly: true }
          readinessProbe: { httpGet: { path: /oauth/healthz, port: 4180 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { cpu: 500m, memory: 256Mi } }
        # --- landing + workshop proxy ----------------------------------
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          command: ["nginx", "-c", "/etc/nginx-custom/nginx.conf", "-g", "daemon off;"]
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx-custom, readOnly: true }
            - { name: site, mountPath: /opt/app-root/src/site, readOnly: true }
            - { name: assets, mountPath: /opt/app-root/src/assets, readOnly: true }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
        # --- seat broker (lookup / provision / reset / admin) ------------
        - name: broker
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/app/broker.py"]
          env:
            - { name: ADMIN_USERS, value: "dpeterson" }
            - { name: MAX_SEATS, value: "25" }
          volumeMounts:
            - { name: broker, mountPath: /app, readOnly: true }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { cpu: 300m, memory: 192Mi } }
      serviceAccountName: factory-hub
      volumes:
        - { name: proxy-secrets, secret: { secretName: factory-hub-proxy } }
        - { name: broker, configMap: { name: factory-hub-broker } }
        - { name: nginx-conf, configMap: { name: factory-hub-nginx } }
        - { name: site, configMap: { name: factory-hub-site } }
        - { name: assets, configMap: { name: factory-hub-assets } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-hub
  namespace: factory-hub
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.hub: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"factory-hub"}}'
    # handsonmode.ai — the same hub behind its own hostnames (Ingress handsonmode-domain below)
    serviceaccounts.openshift.io/oauth-redirecturi.hom: https://handsonmode.ai/oauth/callback
    serviceaccounts.openshift.io/oauth-redirecturi.hom-www: https://www.handsonmode.ai/oauth/callback
    serviceaccounts.openshift.io/oauth-redirecturi.hom-com: https://handsonmode.com/oauth/callback
    serviceaccounts.openshift.io/oauth-redirecturi.hom-com-www: https://www.handsonmode.com/oauth/callback
---
apiVersion: v1
kind: Service
metadata:
  name: factory-hub
  namespace: factory-hub
  labels: { app: factory-hub }
spec:
  selector: { app: factory-hub }
  ports: [{ name: http, port: 8080, targetPort: 4180 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: factory-hub
  namespace: factory-hub
  annotations:
    haproxy.router.openshift.io/timeout: 1h
spec:
  host: factory.apps.salamander.aimlworkbench.com
  to: { kind: Service, name: factory-hub }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
---
# handsonmode.ai — the second front door. Moved here from the preview
# edition's namespace: the hub now owns the domain and proxies the
# library's public pages from that namespace. cert-manager renews it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: handsonmode-domain
  namespace: factory-hub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    route.openshift.io/termination: edge
    haproxy.router.openshift.io/redirect-to-https: "true"
spec:
  ingressClassName: openshift-default
  tls:
    - hosts: [handsonmode.ai, www.handsonmode.ai, handsonmode.com, www.handsonmode.com]
      secretName: handsonmode-tls
  rules:
    - host: handsonmode.ai
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: factory-hub, port: { number: 8080 } } } }] }
    - host: www.handsonmode.ai
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: factory-hub, port: { number: 8080 } } } }] }
    - host: handsonmode.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: factory-hub, port: { number: 8080 } } } }] }
    - host: www.handsonmode.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: factory-hub, port: { number: 8080 } } } }] }
