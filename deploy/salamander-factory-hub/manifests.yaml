# =============================================================================
# Red Hat Software Factory hub — factory.apps.salamander.aimlworkbench.com
#
# The share-out front door for the agents-as-staff workshop. Three tiers:
#
#   PUBLIC   /  /hub/assets/*  the landing page — browse with no account
#   AUTH     /oauth/*          OpenShift oauth-proxy -> cluster OAuth -> Keycloak (factory-sso)
#   WORKSHOP on the seat's own hostname, guarded by its own oauth-proxy (SAR)
#
# oauth-proxy is the only ingress. It skip-auths the landing and its
# assets, runs the OIDC dance for everything else, and forwards the
# signed-in identity (X-Auth-Request-User / -Email) to the nginx
# backend. nginx serves the landing and reverse-proxies the workshop.
#
# PER-SEAT ROUTING (provisioner milestone): the gated location resolves
# the target showroom from the authenticated username —
# showroom-<user>.svc — so once a person's seat exists their own
# environment answers, and until then the holding page does. Today,
# before the provisioner lands, WORKSHOP_UPSTREAM points at the shared
# Red Hat showroom so the gate itself is provable end to end.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-hub-nginx
  namespace: factory-hub
data:
  nginx.conf: |
    error_log /dev/stderr;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      server {
        listen 8080 default_server;
        absolute_redirect off;
        root /opt/app-root/src;

        # -- public landing -------------------------------------------
        location = / { add_header Cache-Control "no-store" always; try_files /site/landing.html =404; }
        # Hub assets live under /hub/assets: Showroom's own shell loads
        # ./assets/index-*.js, so /assets/ must proxy to the seat, not us.
        location /hub/assets/ { alias /opt/app-root/src/assets/; }

        # -- signed-in hub pages + broker API --------------------------
        # no-store: a cached copy of a signed-in page outlives the session and
        # spins on "Checking your workbench" instead of going through sign-in.
        location /hub/ { add_header Cache-Control "no-store" always; alias /opt/app-root/src/site/; }
        location /api/ {
          add_header Cache-Control "no-store" always;
          proxy_pass http://127.0.0.1:9000;
          proxy_set_header X-Forwarded-User $http_x_forwarded_user;
          proxy_read_timeout 60s;
        }

        # -- the workshop lives on the seat's OWN hostname ----------------
        # (guarded there by its own oauth-proxy + SubjectAccessReview).
        # The hub never proxies it: the door just leads to the workbench
        # page, which links to the seat. No Showroom path knowledge here.
        location ~ ^/workshop/ { return 302 /hub/mylab.html; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-hub
  namespace: factory-hub
  labels: { app: factory-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: factory-hub } }
  template:
    metadata:
      labels: { app: factory-hub }
    spec:
      containers:
        # --- the auth gate: OpenShift oauth-proxy (release payload image) --
        # Delegates to the cluster OAuth server, which federates to Keycloak
        # (factory-sso, OIDC, mappingMethod add). The idp hint skips the
        # provider chooser, so an anonymous click lands on Keycloak's own
        # sign-in/register page. The signed-in OpenShift username reaches
        # nginx/broker as X-Forwarded-User.
        - name: oauth-proxy
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:b8e3cc632ec7ee136b1b9296acf51b796c7eefb007f2613ade15ae50ec94d04e
          args:
            - --https-address=
            - --http-address=0.0.0.0:4180
            - --provider=openshift
            - --openshift-service-account=factory-hub
            - --login-url=https://oauth-openshift.apps.salamander.aimlworkbench.com/oauth/authorize?idp=factory-sso
            - --upstream=http://127.0.0.1:8080
            - --cookie-secret-file=/etc/proxy/secrets/cookie-secret
            - --cookie-expire=8h0m0s
            - --cookie-refresh=1h0m0s
            - --pass-user-headers=true
            - --pass-basic-auth=false
            # Browse with no account: the landing and its assets are open.
            - --skip-auth-regex=^/$
            - --skip-auth-regex=^/hub/assets/
            - --skip-provider-button=true
          ports: [{ containerPort: 4180 }]
          volumeMounts:
            - { name: proxy-secrets, mountPath: /etc/proxy/secrets, readOnly: true }
          readinessProbe: { httpGet: { path: /oauth/healthz, port: 4180 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { cpu: 500m, memory: 256Mi } }
        # --- landing + workshop proxy ----------------------------------
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          command: ["nginx", "-c", "/etc/nginx-custom/nginx.conf", "-g", "daemon off;"]
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx-custom, readOnly: true }
            - { name: site, mountPath: /opt/app-root/src/site, readOnly: true }
            - { name: assets, mountPath: /opt/app-root/src/assets, readOnly: true }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
        # --- seat broker (lookup / provision / reset / admin) ------------
        - name: broker
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/app/broker.py"]
          env:
            - { name: ADMIN_USERS, value: "dpeterson" }
            - { name: MAX_SEATS, value: "25" }
          volumeMounts:
            - { name: broker, mountPath: /app, readOnly: true }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { cpu: 300m, memory: 192Mi } }
      serviceAccountName: factory-hub
      volumes:
        - { name: proxy-secrets, secret: { secretName: factory-hub-proxy } }
        - { name: broker, configMap: { name: factory-hub-broker } }
        - { name: nginx-conf, configMap: { name: factory-hub-nginx } }
        - { name: site, configMap: { name: factory-hub-site } }
        - { name: assets, configMap: { name: factory-hub-assets } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-hub
  namespace: factory-hub
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.hub: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"factory-hub"}}'
---
apiVersion: v1
kind: Service
metadata:
  name: factory-hub
  namespace: factory-hub
  labels: { app: factory-hub }
spec:
  selector: { app: factory-hub }
  ports: [{ name: http, port: 8080, targetPort: 4180 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: factory-hub
  namespace: factory-hub
  annotations:
    haproxy.router.openshift.io/timeout: 1h
spec:
  host: factory.apps.salamander.aimlworkbench.com
  to: { kind: Service, name: factory-hub }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
