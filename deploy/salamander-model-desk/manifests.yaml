# model-desk — the cluster's metered model front door (self-hosted MaaS).
# LiteLLM proxy: agents and seats get an OpenAI-compatible baseUrl here and a
# virtual key; upstream provider keys live ONLY in this namespace's Secret.
#
# Secret `model-desk-secrets` is created out-of-band (never in git):
#   LITELLM_MASTER_KEY  — admin key for the proxy (mint/route)
#   OPENAI_API_KEY      — upstream, copied from nl2sql-app-secrets
# Per-seat budgeted keys (keyStrategy: perSeat) come later and need the
# Postgres-backed mode; this DB-less deployment serves the master-key lane.
---
apiVersion: v1
kind: Namespace
metadata:
  name: model-desk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-desk-config
  namespace: model-desk
data:
  config.yaml: |
    model_list:
      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      # Claude via the Red Hat work subscription on Google Vertex AI
      # (project itpc-gcp-global-revenue-claude, region global — per
      # the internal Claude Code install instructions). Credentials:
      # Secret model-desk-gcp-adc, key adc.json (a gcloud
      # application-default login file), mounted at /etc/gcp —
      # created out-of-band, never in git. Until it exists these
      # models error per-call and everything else keeps serving.
      # Anthropic has no 128-entry tools[] cap, so full workshop
      # seats (~200 tools) work on this lane.
      - model_name: claude-sonnet-4-5
        litellm_params:
          model: vertex_ai/claude-sonnet-4-5@20250929
          vertex_project: itpc-gcp-global-revenue-claude
          vertex_location: global
          vertex_credentials: /etc/gcp/adc.json
      - model_name: claude-haiku-4-5
        litellm_params:
          model: vertex_ai/claude-haiku-4-5@20251001
          vertex_project: itpc-gcp-global-revenue-claude
          vertex_location: global
          vertex_credentials: /etc/gcp/adc.json
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-desk
  namespace: model-desk
  labels:
    app: model-desk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-desk
  template:
    metadata:
      labels:
        app: model-desk
    spec:
      containers:
      - name: litellm
        # main-stable as of 2026-08-31, pinned by digest (upstream only ships moving tags)
        image: ghcr.io/berriai/litellm@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
        args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
        envFrom:
        - secretRef:
            name: model-desk-secrets
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
        - name: gcp-adc
          mountPath: /etc/gcp
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: model-desk-config
      - name: gcp-adc
        secret:
          secretName: model-desk-gcp-adc
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: model-desk
  namespace: model-desk
  labels:
    app: model-desk
spec:
  selector:
    app: model-desk
  ports:
  - name: http
    port: 4000
    targetPort: 4000
