# model-desk — the cluster's metered model front door (self-hosted MaaS).
# LiteLLM proxy: agents and seats get an OpenAI-compatible baseUrl here and a
# virtual key; upstream provider keys live ONLY in this namespace's Secret.
#
# Secret `model-desk-secrets` is created out-of-band (never in git):
#   LITELLM_MASTER_KEY  — admin key for the proxy (mint/route)
#   OPENAI_API_KEY      — upstream, copied from nl2sql-app-secrets
# Per-seat budgeted keys (keyStrategy: perSeat) come later and need the
# Postgres-backed mode; this DB-less deployment serves the master-key lane.
---
apiVersion: v1
kind: Namespace
metadata:
  name: model-desk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-desk-config
  namespace: model-desk
data:
  config.yaml: |
    model_list:
      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      # Claude via the Red Hat work subscription on Google Vertex AI
      # (project itpc-gcp-global-revenue-claude, region global — per
      # the internal Claude Code install instructions). Credentials:
      # Secret model-desk-gcp-adc, key adc.json (a gcloud
      # application-default login file), mounted at /etc/gcp —
      # created out-of-band, never in git. Until it exists these
      # models error per-call and everything else keeps serving.
      # Anthropic has no 128-entry tools[] cap, so full workshop
      # seats (~200 tools) work on this lane.
      # Enabled-model sweep 2026-08-31: claude-sonnet-5 is the strongest
      # the project allows (fable-5/opus-5 are catalog-listed but not
      # enabled); claude-opus-4-6 is the strongest Opus-class.
      - model_name: claude-sonnet-5
        litellm_params:
          model: vertex_ai/claude-sonnet-5
          vertex_project: itpc-gcp-global-revenue-claude
          vertex_location: global
          vertex_credentials: /etc/gcp/adc.json
      - model_name: claude-opus-4-6
        litellm_params:
          model: vertex_ai/claude-opus-4-6
          vertex_project: itpc-gcp-global-revenue-claude
          vertex_location: global
          vertex_credentials: /etc/gcp/adc.json
      # Red Hat AI Services BU LiteMaaS (the BU meters our shared key;
      # OUR MaaS adds per-user budgets on top). Key: Secret
      # model-desk-litemaas (out-of-band copy of agent-office/litemaas-api-key).
      - model_name: Qwen3.8-27B
        litellm_params:
          model: openai/Qwen3.8-27B
          api_base: https://litemaas.rhoai.rh-aiservices-bu.com/v1
          api_key: os.environ/LITEMAAS_API_KEY
      - model_name: Qwen3.6-35B-A3B
        litellm_params:
          model: openai/Qwen3.6-35B-A3B
          api_base: https://litemaas.rhoai.rh-aiservices-bu.com/v1
          api_key: os.environ/LITEMAAS_API_KEY
      - model_name: claude-sonnet-4-5
        litellm_params:
          model: vertex_ai/claude-sonnet-4-5@20250929
          vertex_project: itpc-gcp-global-revenue-claude
          vertex_location: global
          vertex_credentials: /etc/gcp/adc.json
      - model_name: claude-haiku-4-5
        litellm_params:
          model: vertex_ai/claude-haiku-4-5@20251001
          vertex_project: itpc-gcp-global-revenue-claude
          vertex_location: global
          vertex_credentials: /etc/gcp/adc.json
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
# TLS front for the MaaS data path: envoy originates TLS to external
# models; LiteLLM itself stays plain HTTP on 4000 for in-cluster
# consumers (agent gateways, probes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-desk-tls-proxy
  namespace: model-desk
data:
  nginx.conf: |
    error_log /dev/stderr;
    pid /tmp/nginx.pid;
    events { worker_connections 512; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      access_log /dev/stdout;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/tls/tls.crt;
        ssl_certificate_key /etc/tls/tls.key;
        client_max_body_size 20m;
        # MaaS forwards the model-scoped public path verbatim
        # (/models-as-a-service/<model>/v1/...); LiteLLM serves /v1/...
        # — strip the scope prefix, pass everything else through.
        location ~ ^/models-as-a-service/[^/]+(?<rest>/.*)$ {
          proxy_pass http://127.0.0.1:4000$rest;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          # MaaS TP does not inject the provider credential on the
          # external-model data path (BBR not rendered here); this leg
          # only carries traffic that already passed MaaS auth+quota,
          # so the sidecar swaps in LiteLLM's key (secret-mounted).
          include /etc/tls-auth/auth.conf;
          proxy_read_timeout 300s;
          proxy_buffering off;
        }
        location / {
          proxy_pass http://127.0.0.1:4000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_read_timeout 300s;
          proxy_buffering off;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-desk
  namespace: model-desk
  labels:
    app: model-desk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-desk
  template:
    metadata:
      labels:
        app: model-desk
    spec:
      containers:
      - name: litellm
        # main-stable as of 2026-08-31, pinned by digest (upstream only ships moving tags)
        image: ghcr.io/berriai/litellm@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
        args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
        envFrom:
        - secretRef:
            name: model-desk-secrets
        - secretRef:
            name: model-desk-litemaas
            optional: true
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
        - name: gcp-adc
          mountPath: /etc/gcp
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - name: tls-proxy
        image: registry.access.redhat.com/ubi9/nginx-124:latest
        command: ["nginx", "-c", "/etc/nginx-custom/nginx.conf", "-g", "daemon off;"]
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: tls-proxy-config
          mountPath: /etc/nginx-custom
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
        - name: tls-auth
          mountPath: /etc/tls-auth
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: model-desk-config
      - name: tls-proxy-config
        configMap:
          name: model-desk-tls-proxy
      - name: tls
        secret:
          secretName: model-desk-tls
      - name: tls-auth
        secret:
          secretName: model-desk-proxy-auth
      - name: gcp-adc
        secret:
          secretName: model-desk-gcp-adc
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: model-desk
  namespace: model-desk
  labels:
    app: model-desk
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: model-desk-tls
spec:
  selector:
    app: model-desk
  ports:
  - name: http
    port: 4000
    targetPort: 4000
  # MaaS's ExternalModel data path originates TLS (external providers
  # are assumed HTTPS) — terminate it on the nginx sidecar.
  - name: https-maas
    port: 443
    targetPort: 8443
