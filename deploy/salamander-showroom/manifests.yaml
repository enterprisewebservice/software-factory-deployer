---
# Source: showroom-single-pod/templates/terminal/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom-factory
  namespace: showroom-factory
---
# Source: showroom-single-pod/templates/proxy/configmap-traefik-dynamic.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-factory-traefik-dynamic
  namespace: showroom-factory
data:
  dynamic.yml: |
    http:
      routers:
        showroom:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - web
          service: showroom
          priority: 1
        terminal:
          rule: "PathPrefix(`/terminal`)"
          entryPoints:
            - web
          service: terminal
          middlewares:
            - terminal-stripprefix
          priority: 10
        wetty:
          rule: "PathPrefix(`/wetty`)"
          entryPoints:
            - web
          service: wetty
          priority: 10

      services:
        showroom:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8000"
        terminal:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:7681"
        wetty:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8001"
      middlewares:
        terminal-stripprefix:
          stripPrefix:
            prefixes:
              - "/terminal"
---
# Source: showroom-single-pod/templates/proxy/configmap-traefik-static.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-factory-traefik-static
  namespace: showroom-factory
data:
  traefik.yml: |
    api:
      dashboard: false
      insecure: false
    entryPoints:
      web:
        address: ":8080"
    ping:
      entryPoint: web
    providers:
      file:
        filename: /etc/traefik/dynamic.yml
        watch: false
    log:
      level: INFO
    accessLog: {}
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
---
# Source: showroom-single-pod/templates/proxy/configmap-user-data.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-factory-userdata
  namespace: showroom-factory
data:
  user_data.yml: |
    user: user1
    password: "<workshop password>"
    openshift_console_url: https://console-openshift-console.apps.salamander.aimlworkbench.com
    openshift_api_url: https://api.salamander.aimlworkbench.com:6443
    devhub_url: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com
    gitops_url: https://openshift-gitops-server-openshift-gitops.apps.salamander.aimlworkbench.com
    mattermost_url: https://mattermost-mattermost.apps.salamander.aimlworkbench.com
    ocp_version: "4.21"
---
# Source: showroom-single-pod/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: showroom-factory-terminal-lab-user-home
  namespace: showroom-factory
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
# Source: showroom-single-pod/templates/terminal/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-showroom-factory-sa
  namespace: showroom-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: showroom-factory
  namespace: showroom-factory
---
# Source: showroom-single-pod/templates/proxy/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: showroom-factory
  namespace: showroom-factory
