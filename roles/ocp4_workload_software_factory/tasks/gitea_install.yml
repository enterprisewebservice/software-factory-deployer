---
# Gitea install: the RHPDS gitea-operator (the same operator the reference cluster runs),
# following rhpds/core_workloads ocp4_workload_gitea_operator. The Gitea CR creates the
# admin user and user1..N; gitea.yml then configures orgs, tokens and Secrets on top.
# Idempotent: every object is state=present and every wait reads status.

- name: gitea install | CatalogSource for the RHPDS gitea operator
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: CatalogSource
      metadata:
        name: gitea-operator-catalogsource
        namespace: openshift-marketplace
      spec:
        sourceType: grpc
        image: "{{ gitea_catalog_image }}:{{ gitea_catalog_image_tag }}"
        displayName: Gitea Operator (RHPDS)
        publisher: RHPDS

- name: gitea install | operator namespace and OperatorGroup
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop:
    - { apiVersion: v1, kind: Namespace, metadata: { name: gitea-operator } }
    - { apiVersion: operators.coreos.com/v1, kind: OperatorGroup, metadata: { name: gitea-operator, namespace: gitea-operator }, spec: {} }
  loop_control: { label: "{{ item.kind }}" }

- name: gitea install | Subscription
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: gitea-operator
        namespace: gitea-operator
      spec:
        name: gitea-operator
        channel: "{{ gitea_operator_channel }}"
        source: gitea-operator-catalogsource
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: gitea install | wait for the operator CSV
  ansible.builtin.include_tasks: wait_for_csv.yml
  vars:
    csv_operator: gitea-operator
    csv_namespace: gitea-operator

- name: gitea install | application namespace (and the Developer Hub namespace the configure stage writes a Secret into)
  kubernetes.core.k8s:
    state: present
    definition: { apiVersion: v1, kind: Namespace, metadata: { name: "{{ item }}" } }
  loop: ["{{ gitea_namespace }}", "{{ rhdh_namespace }}"]

- name: gitea install | Gitea instance (admin + user1..N created by the operator)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gitea.yaml.j2') | from_yaml }}"
  register: r_gitea_cr
  until: r_gitea_cr is success
  retries: 6
  delay: 20
  no_log: true

- name: gitea install | wait for the route, the admin and the users
  kubernetes.core.k8s_info:
    api_version: pfe.rhpds.com/v1
    kind: Gitea
    name: gitea
    namespace: "{{ gitea_namespace }}"
  register: r_gitea_status
  until:
    - r_gitea_status.resources | length > 0
    - r_gitea_status.resources[0].status.giteaRoute is defined
    - r_gitea_status.resources[0].status.adminSetupComplete is defined
    - r_gitea_status.resources[0].status.adminSetupComplete | bool
    - r_gitea_status.resources[0].status.userSetupComplete is defined
    - r_gitea_status.resources[0].status.userSetupComplete | bool
  retries: 90
  delay: 20
  no_log: true

- name: gitea install | facts from the instance status
  ansible.builtin.set_fact:
    gitea_host: "{{ r_gitea_status.resources[0].status.giteaRoute | regex_replace('^https?://', '') | regex_replace('/$', '') }}"
    _gitea_admin_password: "{{ r_gitea_status.resources[0].status.adminPassword }}"
  no_log: true

# The operator renders app.ini with the OAuth2 provider OFF, and Mattermost signs attendees
# in through Gitea's OAuth2 (the authorize endpoint answers 403 while it is off). The
# operator's hook for a custom app.ini is spec.giteaConfigMapName (+ giteaHostname, which
# it insists on): the rendered config is copied with [oauth2] ENABLED = true and the instance
# is pointed at the copy, exactly the reference cluster's shape (gitea-config-factory).
#
# The copy also gets a [repo-archive] section on the repositories volume. The operator's pod
# keeps Gitea's data directory on the container filesystem, so a restart lost every generated
# repository archive while the database kept their records, and from then on the scaffolder's
# fetch of the template skeleton answered 500 "no such file or directory" (found 13 October
# 2026 after the OAuth2 switch restarted Gitea). gitea.yml purges the records on every run.
#
# Idempotent: the copy is re-rendered only when the desired text differs from what is applied
# (or the instance does not point at it), and only then does Gitea restart.
- name: gitea install | the operator-rendered app.ini
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: gitea-config
    namespace: "{{ gitea_namespace }}"
  register: r_gitea_cm
  no_log: true

- name: gitea install | the applied copy, if any
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: gitea-config-factory
    namespace: "{{ gitea_namespace }}"
  register: r_gitea_cm_factory
  no_log: true

- name: gitea install | the app.ini this cluster should run
  ansible.builtin.set_fact:
    # A double-quoted scalar: YAML turns the \n escapes into newlines before Jinja sees them (a
    # folded scalar leaves them as two characters and nothing matches).
    _gitea_factory_ini: "{{ (r_gitea_cm.resources[0].data['app.ini'] | replace('[oauth2]\nENABLED = false', '[oauth2]\nENABLED = true')) ~ ('' if '[repo-archive]' in r_gitea_cm.resources[0].data['app.ini'] else '\n[repo-archive]\nSTORAGE_TYPE = local\nPATH = ' ~ gitea_repo_archive_path ~ '\n') }}"
    _gitea_factory_current: "{{ (r_gitea_cm_factory.resources[0].data['app.ini'] | default('')) if (r_gitea_cm_factory.resources | length > 0) else '' }}"
  no_log: true

- name: gitea install | configuration change needed?
  ansible.builtin.set_fact:
    _gitea_config_change: >-
      {{ (_gitea_factory_current != _gitea_factory_ini)
         or ((r_gitea_status.resources[0].spec.giteaConfigMapName | default('')) != 'gitea-config-factory') }}

- name: gitea install | OAuth2-enabled config with persistent archives
  when: _gitea_config_change | bool
  block:
    - name: gitea install | the Deployment and its pods before the change
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: gitea
        namespace: "{{ gitea_namespace }}"
      register: r_gitea_dep_before

    - name: gitea install | the app.ini copy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: gitea-config-factory
            namespace: "{{ gitea_namespace }}"
            labels: { app.kubernetes.io/managed-by: software-factory-deployer }
          data:
            app.ini: "{{ _gitea_factory_ini }}"
      no_log: true

    - name: gitea install | point the instance at it
      kubernetes.core.k8s:
        state: patched
        api_version: pfe.rhpds.com/v1
        kind: Gitea
        name: gitea
        namespace: "{{ gitea_namespace }}"
        definition:
          spec:
            giteaConfigMapName: gitea-config-factory
            giteaHostname: "{{ gitea_host }}"

    # A new pod mounts the current copy; when the instance already pointed at the copy, only
    # its text changed and nothing restarts Gitea on its own.
    - name: gitea install | pods running the old configuration
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ gitea_namespace }}"
        label_selectors: "{{ (r_gitea_dep_before.resources[0].spec.selector.matchLabels | default({})) | dict2items | map(attribute='key') | zip((r_gitea_dep_before.resources[0].spec.selector.matchLabels | default({})) | dict2items | map(attribute='value')) | map('join', '=') | list }}"
      register: r_gitea_old_pods
      when: (r_gitea_dep_before.resources | length > 0) and (r_gitea_dep_before.resources[0].spec.template.spec.volumes | selectattr('name', 'equalto', 'gitea-config') | map(attribute='configMap.name') | first | default('')) == 'gitea-config-factory'

    - name: gitea install | replace them
      kubernetes.core.k8s:
        state: absent
        kind: Pod
        name: "{{ item.metadata.name }}"
        namespace: "{{ gitea_namespace }}"
      loop: "{{ r_gitea_old_pods.resources | default([]) }}"
      loop_control: { label: "{{ item.metadata.name }}" }

    - name: gitea install | wait for the instance to run the copy
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: gitea
        namespace: "{{ gitea_namespace }}"
      register: r_gitea_dep
      until: >-
        r_gitea_dep.resources | length > 0 and
        (r_gitea_dep.resources[0].spec.template.spec.volumes | selectattr('name', 'equalto', 'gitea-config') | map(attribute='configMap.name') | first | default('')) == 'gitea-config-factory' and
        (r_gitea_dep.resources[0].status.readyReplicas | default(0)) | int >= 1 and
        (r_gitea_dep.resources[0].status.unavailableReplicas | default(0)) | int == 0
      retries: 60
      delay: 10

- name: gitea install | OAuth2 authorize endpoint answers (303 to sign-in, never 403)
  ansible.builtin.uri:
    url: "https://{{ gitea_host }}/login/oauth/authorize?response_type=code&client_id=probe&redirect_uri=https://{{ gitea_host }}/&state=x&scope=read:user"
    validate_certs: false
    follow_redirects: none
    status_code: [200, 303, 302, 400]
  register: r_gitea_oauth_probe
  retries: 12
  delay: 10
  until: r_gitea_oauth_probe.status != 403

# gitea.yml reads the admin password from this Secret (the reference cluster's shape)
- name: gitea install | admin credentials Secret for the configure stage
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitea-admin-credentials
        namespace: "{{ gitea_namespace }}"
      type: Opaque
      stringData:
        username: "{{ gitea_admin_user }}"
        password: "{{ _gitea_admin_password }}"
  no_log: true

- name: gitea install | ready
  ansible.builtin.debug:
    msg: "Gitea at https://{{ gitea_host }} with admin {{ gitea_admin_user }} and {{ num_users }} users"
