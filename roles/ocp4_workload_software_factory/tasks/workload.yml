---
# Install order matters: operators → gitops bootstrap → RHOAI/MaaS → RHDH → identity/users →
# agent platform → verify. Each stage gates on health before the next.
- ansible.builtin.include_tasks: operators.yml
- ansible.builtin.include_tasks: gitops.yml
- ansible.builtin.include_tasks: rhoai_maas.yml
- ansible.builtin.include_tasks: rhdh.yml
- ansible.builtin.include_tasks: keycloak_users.yml
- ansible.builtin.include_tasks: agent_platform.yml
- ansible.builtin.include_tasks: verify.yml
