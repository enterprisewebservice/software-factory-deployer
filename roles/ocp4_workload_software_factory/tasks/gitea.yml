---
# In-cluster Gitea for attendee agent repos.
#
# TODO(iteration-1): the INSTALL itself — Gitea operator (agnosticd has
# existing gitea workload patterns to reuse) and, with it, the Keycloak
# OIDC auth source so user1..N sign in with the same SSO as the cluster,
# Developer Hub, and Mattermost. Until that lands, users are created as
# local Gitea accounts sharing the per-order workshop password; flipping
# them to the OIDC source is part of the operator install task.
#
# Everything below CONFIGURES the agent-platform contract on top of an
# installed Gitea. The shapes were verified live end to end on salamander
# 2026-08-24 (gitea-provider verification run): publish:gitea into a
# per-user org → ApplicationSet discovery (~1 min) → Synced/Healthy →
# AgentWorkstation Running; repo delete → Application pruned (~48 s).
#
# Contract created here, consumed by the openclaw-agent-genesis template
# and the gitea ApplicationSet:
#   - one org per attendee, named <user><gitea_user_org_suffix>, owned by
#     that attendee (publish:gitea refuses to create orgs, and an org can
#     never share a name with its owning user — hence the suffix);
#   - {{ gitea_rhdh_secret_name }} in the RHDH namespace
#     (GITEA_USERNAME/GITEA_PASSWORD) for the publish:gitea integration;
#   - {{ gitea_scm_secret_name }} in openshift-gitops (key: token) for the
#     ApplicationSet's per-org gitea scmProvider generators;
#   - the agent-office AppProject + agent-office-agents ApplicationSet
#     (gitea flavor of the reference cluster's manifests).

- name: gitea | install (operator + instance + admin + users)
  ansible.builtin.include_tasks: gitea_install.yml

- name: gitea | host, API and admin facts
  ansible.builtin.include_tasks: gitea_facts.yml

- name: gitea | ensure per-attendee users exist
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/admin/users"
    method: POST
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ keycloak_user_prefix }}{{ item }}"
      email: "{{ keycloak_user_prefix }}{{ item }}@{{ gitea_host }}"
      password: "{{ _seat_passwords[keycloak_user_prefix ~ item] }}"
      must_change_password: false
    status_code: [201, 422] # 422 = already exists (idempotent re-run)
  loop: "{{ range(1, num_users | int + 1) | list }}"
  no_log: true

# Existing users converge on the seat password too (a re-run after the password source
# changed, or after a base rotated it), so the Gitea password never drifts from Keycloak's.
- name: gitea | per-attendee passwords converge
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/admin/users/{{ keycloak_user_prefix }}{{ item }}"
    method: PATCH
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      login_name: "{{ keycloak_user_prefix }}{{ item }}"
      source_id: 0
      password: "{{ _seat_passwords[keycloak_user_prefix ~ item] }}"
      must_change_password: false
    status_code: [200]
  loop: "{{ range(1, num_users | int + 1) | list }}"
  no_log: true

- name: gitea | ensure per-attendee orgs exist, owned by the attendee
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/admin/users/{{ keycloak_user_prefix }}{{ item }}/orgs"
    method: POST
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ keycloak_user_prefix }}{{ item }}{{ gitea_user_org_suffix }}"
      visibility: public
    status_code: [201, 422]
  loop: "{{ range(1, num_users | int + 1) | list }}"
  no_log: true

# One admin token serves both consumers (publish runs as the platform, not
# the attendee — same trust model as the reference cluster's GitHub App).
#
# The token is minted once and kept: Developer Hub reads its copy at pod start, so a
# token rotated on every run left the scaffolder with a stale one after any re-run
# (401 on fetch:template, found 13 October 2026). A re-run keeps the stored token as
# long as Gitea still accepts it and mints a new one only when it is missing or dead.
- name: gitea | stored platform token, if any
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ gitea_rhdh_secret_name }}"
    namespace: "{{ rhdh_namespace | default('rhdh') }}"
  register: r_gitea_rhdh_secret
  no_log: true

- name: gitea | does the stored platform token still authenticate?
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/user"
    headers: { Authorization: "token {{ r_gitea_rhdh_secret.resources[0].data.GITEA_PASSWORD | b64decode }}" }
    status_code: [200, 401, 403]
    validate_certs: false
  register: r_gitea_token_probe
  when: r_gitea_rhdh_secret.resources | length > 0
  no_log: true

- name: gitea | platform token verdict
  ansible.builtin.set_fact:
    _gitea_platform_token_ok: "{{ (r_gitea_rhdh_secret.resources | length > 0) and ((r_gitea_token_probe.status | default(0)) == 200) }}"

- name: gitea | mint the platform API token (only when missing or no longer accepted)
  when: not (_gitea_platform_token_ok | bool)
  block:
    - name: gitea | drop a dead platform token of the same name
      ansible.builtin.uri:
        url: "{{ _gitea_api }}/users/{{ gitea_admin_user }}/tokens/agent-platform"
        method: DELETE
        url_username: "{{ gitea_admin_user }}"
        url_password: "{{ _gitea_admin_password }}"
        force_basic_auth: true
        status_code: [204, 404]
      no_log: true

    - name: gitea | create the platform API token
      ansible.builtin.uri:
        url: "{{ _gitea_api }}/users/{{ gitea_admin_user }}/tokens"
        method: POST
        url_username: "{{ gitea_admin_user }}"
        url_password: "{{ _gitea_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: agent-platform
          scopes: ["all"]
        status_code: [201]
      register: r_gitea_token
      no_log: true

- name: gitea | the platform token in use
  ansible.builtin.set_fact:
    _gitea_platform_token: "{{ (r_gitea_rhdh_secret.resources[0].data.GITEA_PASSWORD | b64decode) if (_gitea_platform_token_ok | bool) else r_gitea_token.json.sha1 }}"
  no_log: true

- name: gitea | publish credentials Secret for RHDH (publish:gitea integration)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitea_rhdh_secret_name }}"
        namespace: "{{ rhdh_namespace | default('rhdh') }}"
      type: Opaque
      stringData:
        GITEA_USERNAME: "{{ gitea_admin_user }}"
        GITEA_PASSWORD: "{{ _gitea_platform_token }}"
  no_log: true

- name: gitea | scm token Secret for the ApplicationSet generators
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitea_scm_secret_name }}"
        namespace: openshift-gitops
      type: Opaque
      stringData:
        token: "{{ _gitea_platform_token }}"
  no_log: true

# Per-seat agent tokens — the pass-through credential each seat's own
# AgentGateway sends to the governed gitea-mcp backend (agent-office
# cluster/gitea-mcp): Authorization: Bearer ${GITEA_TOKEN}, resolved
# from Secret <user>-gitea-token via the AgentWorkstation's
# spec.tools.mcpServers[].envFromSecret. gitea_* calls act AS the
# seat's Gitea user — this token IS the tenancy boundary (no injection
# on the gitea path, unlike github's App token). Canonical Secrets live
# HERE (the gitea namespace always exists at this stage; the seat
# workspaces may not yet) — replicating them into each
# <user>-agent-workspace is the imperative companion documented in
# deploy/salamander-workspaces/manifests.yaml. Recreate-on-run rotates
# the tokens: re-replicate the workspace copies after a re-run.
# Minted once per seat and kept: the seat's AgentGateway pods read their copy at start,
# so a token rotated on every run would leave every running agent with a dead one after a
# re-run. A seat gets a new token only when its canonical Secret is missing or Gitea no
# longer accepts the stored one.
- name: gitea | stored per-seat tokens
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ gitea_namespace }}"
    label_selectors: ["app.kubernetes.io/managed-by=software-factory-deployer"]
  register: r_gitea_seat_secrets
  no_log: true

- name: gitea | stored per-seat tokens by seat
  ansible.builtin.set_fact:
    _seat_tokens_stored: >-
      {%- set m = {} -%}
      {%- for sec in (r_gitea_seat_secrets.resources | default([])) -%}
        {%- set seat = sec.metadata.labels['software-factory.redhat.com/seat'] | default('') -%}
        {%- if seat and sec.metadata.name == seat ~ '-gitea-token' and (sec.data.GITEA_TOKEN is defined) -%}
          {%- set _ = m.update({seat: (sec.data.GITEA_TOKEN | b64decode)}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ m }}
  no_log: true

- name: gitea | do the stored per-seat tokens still authenticate?
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/user"
    headers: { Authorization: "token {{ _seat_tokens_stored[keycloak_user_prefix ~ item] | default('none') }}" }
    status_code: [200, 401, 403]
    validate_certs: false
  register: r_gitea_seat_probe
  loop: "{{ range(1, num_users | int + 1) | list }}"
  loop_control: { label: "{{ keycloak_user_prefix }}{{ item }}" }
  no_log: true

- name: gitea | seats that need a token
  ansible.builtin.set_fact:
    _seats_needing_token: >-
      {{ r_gitea_seat_probe.results | rejectattr('status', 'equalto', 200) | map(attribute='item') | list }}

- name: gitea | drop a dead per-seat token of the same name
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/users/{{ keycloak_user_prefix }}{{ item }}/tokens/agent-workspace"
    method: DELETE
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    status_code: [204, 404]
  loop: "{{ _seats_needing_token }}"
  loop_control: { label: "{{ keycloak_user_prefix }}{{ item }}" }
  no_log: true

- name: gitea | create per-attendee agent tokens (seats without a live one)
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/users/{{ keycloak_user_prefix }}{{ item }}/tokens"
    method: POST
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: agent-workspace
      scopes: ["all"]
    status_code: [201]
  register: r_gitea_seat_tokens
  loop: "{{ _seats_needing_token }}"
  loop_control: { label: "{{ keycloak_user_prefix }}{{ item }}" }
  no_log: true

- name: gitea | per-seat tokens in use (kept ones plus the new ones)
  ansible.builtin.set_fact:
    _seat_tokens: >-
      {%- set m = {} -%}
      {%- for n in range(1, num_users | int + 1) -%}
        {%- set u = keycloak_user_prefix ~ n -%}
        {%- if u in _seat_tokens_stored and n not in _seats_needing_token -%}
          {%- set _ = m.update({u: _seat_tokens_stored[u]}) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for r in (r_gitea_seat_tokens.results | default([])) -%}
        {%- if r.json is defined -%}
          {%- set _ = m.update({(keycloak_user_prefix ~ r.item): r.json.sha1}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ m }}
  no_log: true

- name: gitea | canonical per-seat token Secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.key }}-gitea-token"
        namespace: "{{ gitea_namespace }}"
        labels:
          app.kubernetes.io/managed-by: software-factory-deployer
          software-factory.redhat.com/seat: "{{ item.key }}"
      type: Opaque
      stringData:
        GITEA_TOKEN: "{{ item.value }}"
  loop: "{{ _seat_tokens | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# Broker discovery credential for the gitea MCPServerRegistration — the
# mcp-gateway broker's tools/list connection ONLY (Kuadrant #926: the
# credentialRef never rides the per-call path; per-call auth is the
# seat token above passing through). Shape is the broker contract: key
# AUTHORIZATION holds the literal header value, and the
# mcp.kuadrant.io/secret label is the broker's Secret filter. Canonical
# here; replicate into agent-office beside the registration (same
# manifests.yaml companion).
- name: gitea | mint the mcp-broker discovery token (recreate to stay idempotent)
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/users/{{ gitea_admin_user }}/tokens/mcp-broker"
    method: DELETE
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    status_code: [204, 404]
  no_log: true

- name: gitea | create the mcp-broker discovery token
  ansible.builtin.uri:
    url: "{{ _gitea_api }}/users/{{ gitea_admin_user }}/tokens"
    method: POST
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: mcp-broker
      scopes: ["read:user"]
    status_code: [201]
  register: r_gitea_broker_token
  no_log: true

- name: gitea | canonical broker credential Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitea-mcp-broker-token
        namespace: "{{ gitea_namespace }}"
        labels:
          mcp.kuadrant.io/secret: "true"
          app.kubernetes.io/name: gitea-mcp-server
          app.kubernetes.io/component: broker-credential
      type: Opaque
      stringData:
        AUTHORIZATION: "Bearer {{ r_gitea_broker_token.json.sha1 }}"
  no_log: true

- name: gitea | agent-office AppProject + ApplicationSet (gitea flavor)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
    - agent-office-appproject-gitea.yaml.j2
    - agent-office-appset-gitea.yaml.j2
    - agent-office-seat-services-appset-gitea.yaml.j2
