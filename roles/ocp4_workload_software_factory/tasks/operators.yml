---
# Operator installs. Channels/sources mirror the reference cluster (agent-office/cluster/*).
# Fresh-cluster safe (Field Content base):
#   - packages that already have a CSV are skipped (the base ships OpenShift GitOps);
#   - the OpenShift AI operator gets its namespace + OperatorGroup first;
#   - the agent-office operator is left out until agent_office_catalog_image names a catalog
#     the cluster can pull (today the images live only in the reference cluster's Quay).
# Subscriptions are few and small. A cluster-wide CSV list is not: OLM copies every
# AllNamespaces CSV into every namespace, and dumping that result killed the first RHDP run.
- name: operators | list existing Subscriptions (package names already installed)
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
  register: r_subs_all

# The operator's environment, applied the OLM way (Subscription spec.config.env). The
# recommender entries make the hiring form's "draft my agent" step model-driven through
# the endpoint RHDP issued with the order; without them the operator's keyword fallback
# answers. The token rides a Secret reference, never a value in the Subscription.
- name: operators | agent-office operator environment
  ansible.builtin.set_fact:
    _recommender_on: "{{ maas_external_provider_url | length > 0 and maas_external_provider_secret | length > 0 }}"
    _agent_office_env: >-
      {{
        [{'name': 'MANAGED_NAMESPACES', 'value': ocp4_workload_software_factory_namespace},
         {'name': 'AGENT_REGISTRY_URLS', 'value': agent_registry_urls}]
        + ([{'name': 'AGENT_RECOMMENDER_URL', 'value': maas_external_provider_url ~ '/chat/completions'},
            {'name': 'AGENT_RECOMMENDER_MODEL', 'value': maas_external_provider_model},
            {'name': 'AGENT_RECOMMENDER_TOKEN', 'secretKeyRef': {'name': 'rhdp-litemaas-api-key', 'key': 'api-key'}}]
           if (maas_external_provider_url | length > 0 and maas_external_provider_secret | length > 0) else [])
      }}

- name: operators | build the subscription list
  ansible.builtin.set_fact:
    _installed_packages: "{{ r_subs_all.resources | map(attribute='spec.name') | list | unique }}"
    _subscriptions: >-
      {{
        [
          {'name': 'openshift-gitops-operator', 'ns': 'openshift-operators', 'source': 'redhat-operators', 'channel': 'latest'},
          {'name': 'openshift-pipelines-operator-rh', 'ns': 'openshift-operators', 'source': 'redhat-operators', 'channel': 'latest'},
          {'name': 'rhods-operator', 'ns': 'redhat-ods-operator', 'source': 'redhat-operators', 'channel': 'stable'},
          {'name': 'external-secrets-operator', 'ns': 'openshift-operators', 'source': 'community-operators', 'channel': eso_channel},
          {'name': 'mcp-gateway', 'ns': 'openshift-operators', 'source': 'redhat-operators', 'channel': mcp_gateway_channel}
        ] + ([{'name': 'agent-office-operator', 'ns': 'agent-office-operator', 'source': 'agent-office-operator-catalog', 'channel': agent_office_channel, 'env': _agent_office_env}]
             if agent_office_catalog_image | length > 0 else [])
      }}

- name: operators | agent-office-operator CatalogSource
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'catalogsource.yml.j2') | from_yaml }}"
  when: agent_office_catalog_image | length > 0

# Only when this run subscribes OpenShift AI itself. A namespace must hold exactly one
# OperatorGroup: adding a second one next to the base's broke its CSV on the first RHDP run.
- name: operators | OpenShift AI operator namespace
  kubernetes.core.k8s:
    state: present
    definition: { apiVersion: v1, kind: Namespace, metadata: { name: redhat-ods-operator } }
  when: "'rhods-operator' not in _installed_packages"

- name: operators | existing OperatorGroups in redhat-ods-operator
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: redhat-ods-operator
  register: r_rhods_og
  when: "'rhods-operator' not in _installed_packages"

- name: operators | OpenShift AI OperatorGroup (only if the namespace has none)
  kubernetes.core.k8s:
    state: present
    definition: { apiVersion: operators.coreos.com/v1, kind: OperatorGroup, metadata: { name: redhat-ods-operator, namespace: redhat-ods-operator }, spec: {} }
  when: "'rhods-operator' not in _installed_packages and (r_rhods_og.resources | default([]) | length == 0)"

- name: operators | already installed by the base (skipped)
  ansible.builtin.debug:
    msg: "{{ _subscriptions | map(attribute='name') | select('in', _installed_packages) | list }}"

- name: operators | agent-office operator namespace and OperatorGroup (AllNamespaces, as on the reference cluster)
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop:
    - { apiVersion: v1, kind: Namespace, metadata: { name: agent-office-operator } }
    - { apiVersion: operators.coreos.com/v1, kind: OperatorGroup, metadata: { name: agent-office-operator, namespace: agent-office-operator }, spec: {} }
  loop_control: { label: "{{ item.kind }}" }
  when: agent_office_catalog_image | length > 0 and 'agent-office-operator' not in _installed_packages

# The operator's Deployment reads the recommender token from this Secret; it must exist
# before the Subscription, or the CSV never turns Succeeded (the pod cannot start).
- name: operators | recommender token for the operator (the key RHDP issued)
  when: agent_office_catalog_image | length > 0 and _recommender_on | bool
  block:
    - name: operators | read the key RHDP issued
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ maas_external_provider_secret }}"
        namespace: "{{ userinfo_namespace }}"
      register: r_op_maas_secret
      no_log: true

    - name: operators | key Secret beside the operator
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - { apiVersion: v1, kind: Namespace, metadata: { name: agent-office-operator } }
        - apiVersion: v1
          kind: Secret
          metadata: { name: rhdp-litemaas-api-key, namespace: agent-office-operator }
          type: Opaque
          stringData:
            api-key: "{{ r_op_maas_secret.resources[0].data.apiKey | b64decode }}"
      loop_control: { label: "{{ item.kind }}" }
      no_log: true

# Packages that already have a Subscription belong to whoever created it (the base, an
# earlier run) and are skipped. The agent-office operator's is ours: it is re-applied every
# run so environment changes (the recommender) reach the Deployment through OLM.
- name: operators | subscriptions (skipping packages that already have one)
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'subscription.yml.j2') | from_yaml }}"
  loop: "{{ _subscriptions }}"
  loop_control: { label: "{{ item.name }}" }
  when: item.name not in _installed_packages or item.name == 'agent-office-operator'

# Wait only for what this run subscribed. A package the base (or an earlier run) installed is
# its owner's responsibility; blocking on it would turn their failure into ours.
- name: operators | wait for the CSVs of the subscriptions this run created
  ansible.builtin.include_tasks: wait_for_csv.yml
  loop: "{{ ['openshift-gitops-operator', 'openshift-pipelines-operator-rh', 'rhods-operator', 'agent-office-operator'] | reject('in', _installed_packages) | select('in', _subscriptions | map(attribute='name') | list) | list }}"
  loop_control: { loop_var: csv_operator }
