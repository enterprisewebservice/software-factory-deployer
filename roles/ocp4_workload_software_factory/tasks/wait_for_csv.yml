---
- name: "Wait for CSV: {{ csv_operator }}"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
  register: r_csv
  retries: 60
  delay: 10
  until: >-
    r_csv.resources | selectattr('metadata.name', 'search', csv_operator)
    | selectattr('status.phase', 'defined') | selectattr('status.phase', 'equalto', 'Succeeded')
    | list | length > 0
