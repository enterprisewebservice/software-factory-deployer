---
# Golden-path template registration, gitea flavor.
#
# ONE template file serves both providers simultaneously: the genesis
# template's hidden gitProvider parameter ships as 'auto' — the per-hire
# verdict routes Keycloak-ingested attendees (keycloak.org/id annotation)
# to Gitea and everyone else to GitHub. Registering on a gitea cluster =
# mirror the pinned repo into the in-cluster Gitea and set exactly ONE
# default — giteaHost — nothing else. (The rewritten-defaults artifact
# shape is the one verified live on salamander 2026-08-24.)
#
# The mirror lives at {{ gitea_templates_org }}/{{ gitea_templates_repo }};
# the catalog Location pointing at it ships statically in the rhdh stage's
# app-config (see rhdh-app-config-gitea-fragment.yaml.j2). fetch:template's
# relative ../openclaw-agent/skeleton resolves against the mirror through
# the gitea integration (GiteaUrlReader implements readTree).

- name: rhdh gitea templates | preconditions
  ansible.builtin.assert:
    that:
      - rhdh_golden_path_template_repo | length > 0
      - rhdh_golden_path_template_revision is defined
      - gitea_host | length > 0
    fail_msg: >-
      Set rhdh_golden_path_template_repo + rhdh_golden_path_template_revision
      (pinned) and run the gitea stage first (gitea_host).

- name: rhdh gitea templates | ensure the mirror org exists
  ansible.builtin.uri:
    url: "https://{{ gitea_host }}/api/v1/orgs"
    method: POST
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ gitea_templates_org }}"
      visibility: public
    status_code: [201, 422]
  no_log: true

- name: rhdh gitea templates | ensure the mirror repo exists
  ansible.builtin.uri:
    url: "https://{{ gitea_host }}/api/v1/orgs/{{ gitea_templates_org }}/repos"
    method: POST
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ _gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ gitea_templates_repo }}"
      private: false
    status_code: [201, 409, 422]
  no_log: true

- name: rhdh gitea templates | working directory
  ansible.builtin.tempfile:
    state: directory
    suffix: gp-templates
  register: r_tpl_dir

- name: rhdh gitea templates | clone the pinned template repo
  ansible.builtin.git:
    repo: "{{ rhdh_golden_path_template_repo }}"
    dest: "{{ r_tpl_dir.path }}/src"
    version: "{{ rhdh_golden_path_template_revision }}"
    depth: 1

# The registration-time rewrite — the ONLY delta vs the reference template.
# gitProvider stays 'auto': GitHub users on this cluster keep the GitHub
# path; only Keycloak attendees route to Gitea.
- name: rhdh gitea templates | point giteaHost default at this cluster
  ansible.builtin.replace:
    path: "{{ r_tpl_dir.path }}/src/samples/templates/openclaw-agent-genesis/template.yaml"
    regexp: "^(\\s+)default: ''$"
    replace: "\\1default: '{{ gitea_host }}'"

- name: rhdh gitea templates | verify the rewrite landed exactly once
  ansible.builtin.command:
    argv: [grep, -c, "default: '{{ gitea_host }}'", "{{ r_tpl_dir.path }}/src/samples/templates/openclaw-agent-genesis/template.yaml"]
  register: r_rewrite_check
  failed_when: r_rewrite_check.stdout != "1"
  changed_when: false

- name: rhdh gitea templates | verify gitProvider still ships as auto
  ansible.builtin.command:
    argv: [grep, -c, "default: auto", "{{ r_tpl_dir.path }}/src/samples/templates/openclaw-agent-genesis/template.yaml"]
  register: r_auto_check
  failed_when: r_auto_check.stdout != "1"
  changed_when: false

- name: rhdh gitea templates | push the mirror
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
    cd "{{ r_tpl_dir.path }}/src"
    git -c user.name="software-factory-deployer" -c user.email="deployer@{{ gitea_host }}" \
      commit -am "workshop registration rewrite: giteaHost={{ gitea_host }} (gitProvider stays auto)"
    git push --force \
      "https://{{ gitea_admin_user }}:{{ r_gitea_token.json.sha1 }}@{{ gitea_host }}/{{ gitea_templates_org }}/{{ gitea_templates_repo }}.git" \
      HEAD:refs/heads/main
  no_log: true

- name: rhdh gitea templates | drop the working directory
  ansible.builtin.file:
    path: "{{ r_tpl_dir.path }}"
    state: absent
