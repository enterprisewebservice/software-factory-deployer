---
# One generated password per order for the workshop's own services (Gitea, Mattermost)
# until those sign in through the cluster's Keycloak. Stored once in a Secret so re-runs
# of the Job reuse it instead of rotating it under the attendees.
- name: workshop password | namespace
  kubernetes.core.k8s:
    state: present
    definition: { apiVersion: v1, kind: Namespace, metadata: { name: "{{ userinfo_namespace }}" } }

- name: workshop password | existing Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: software-factory-workshop-users
    namespace: "{{ userinfo_namespace }}"
  register: r_ws_secret
  no_log: true

- name: workshop password | create once
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: software-factory-workshop-users
        namespace: "{{ userinfo_namespace }}"
      type: Opaque
      stringData:
        password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  when: r_ws_secret.resources | length == 0
  no_log: true

- name: workshop password | read back
  kubernetes.core.k8s_info:
    kind: Secret
    name: software-factory-workshop-users
    namespace: "{{ userinfo_namespace }}"
  register: r_ws_secret
  no_log: true

- name: workshop password | fact
  ansible.builtin.set_fact:
    workshop_user_password: "{{ keycloak_user_password if (keycloak_user_password | length > 0) else (r_ws_secret.resources[0].data.password | b64decode) }}"
  no_log: true

- name: workshop password | the same value serves every workshop login that is not cluster SSO
  ansible.builtin.set_fact:
    keycloak_user_password: "{{ workshop_user_password }}"
  no_log: true

# On an RHDP order the base already created user1..N in its Keycloak, each with its own
# password, and shows those on the order page; nothing passes them to this chart. They are
# readable from the base's KeycloakRealmImport, so every seat adopts the password its
# Keycloak identity already has: one password per attendee for the console, Developer Hub,
# GitOps, Gitea and Mattermost. Without a realm import (not an RHDP order) every seat
# keeps the generated password above.
- name: workshop password | the base's Keycloak realm import, if any
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: KeycloakRealmImport
  register: r_realm_imports
  failed_when: false
  no_log: true

- name: workshop password | passwords the base set per user
  ansible.builtin.set_fact:
    _base_user_passwords: >-
      {%- set out = {} -%}
      {%- for ri in (r_realm_imports.resources | default([])) -%}
        {%- if (ri.spec.realm.realm | default('')) == keycloak_realm -%}
          {%- for u in (ri.spec.realm.users | default([])) -%}
            {%- for c in (u.credentials | default([])) -%}
              {%- if (c.type | default('')) == 'password' and c.value is defined -%}
                {%- set _ = out.update({u.username: c.value}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: workshop password | one password per seat
  ansible.builtin.set_fact:
    _seat_passwords: >-
      {%- set m = {} -%}
      {%- for n in range(1, num_users | int + 1) -%}
        {%- set u = keycloak_user_prefix ~ n -%}
        {%- set _ = m.update({u: (_base_user_passwords[u] if u in _base_user_passwords else workshop_user_password)}) -%}
      {%- endfor -%}
      {{ m }}
  no_log: true

- name: workshop password | source
  ansible.builtin.debug:
    msg: "seat passwords: {{ (_base_user_passwords | length > 0) | ternary('adopted from the base Keycloak realm import', 'generated for this order') }} ({{ _seat_passwords | length }} seats)"
