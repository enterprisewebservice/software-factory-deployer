---
# One generated password per order for the workshop's own services (Gitea, Mattermost)
# until those sign in through the cluster's Keycloak. Stored once in a Secret so re-runs
# of the Job reuse it instead of rotating it under the attendees.
- name: workshop password | namespace
  kubernetes.core.k8s:
    state: present
    definition: { apiVersion: v1, kind: Namespace, metadata: { name: "{{ userinfo_namespace }}" } }

- name: workshop password | existing Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: software-factory-workshop-users
    namespace: "{{ userinfo_namespace }}"
  register: r_ws_secret
  no_log: true

- name: workshop password | create once
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: software-factory-workshop-users
        namespace: "{{ userinfo_namespace }}"
      type: Opaque
      stringData:
        password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  when: r_ws_secret.resources | length == 0
  no_log: true

- name: workshop password | read back
  kubernetes.core.k8s_info:
    kind: Secret
    name: software-factory-workshop-users
    namespace: "{{ userinfo_namespace }}"
  register: r_ws_secret
  no_log: true

- name: workshop password | fact
  ansible.builtin.set_fact:
    workshop_user_password: "{{ keycloak_user_password if (keycloak_user_password | length > 0) else (r_ws_secret.resources[0].data.password | b64decode) }}"
  no_log: true

- name: workshop password | the same value serves every workshop login that is not cluster SSO
  ansible.builtin.set_fact:
    keycloak_user_password: "{{ workshop_user_password }}"
  no_log: true
