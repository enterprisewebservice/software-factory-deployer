---
# Agent platform stage: the agent-office operator and what every seat's gateway needs from
# the platform namespace. Ground truth: agent-office/cluster/{operator,skills-scc,
# model-connections/groups}. The operator Subscription itself is created by operators.yml
# when agent_office_catalog_image names a pullable catalog (quay.io/dpeterso).

- name: platform | namespace {{ ocp4_workload_software_factory_namespace }} (MANAGED_NAMESPACES entry; seats join by label)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_software_factory_namespace }}"
        labels:
          agentoffice.ai/managed: "true"
          app.kubernetes.io/part-of: agent-office

# --- the SCC gateway pods run under (image volumes for the skills catalog)
- name: platform | SecurityContextConstraints agent-office-imagevol
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.openshift.io/v1
      kind: SecurityContextConstraints
      metadata: { name: agent-office-imagevol }
      allowHostDirVolumePlugin: false
      allowHostIPC: false
      allowHostNetwork: false
      allowHostPID: false
      allowHostPorts: false
      allowPrivilegeEscalation: false
      allowPrivilegedContainer: false
      allowedCapabilities: [NET_BIND_SERVICE]
      defaultAddCapabilities: null
      fsGroup: { type: MustRunAs }
      priority: 10
      readOnlyRootFilesystem: false
      requiredDropCapabilities: [ALL]
      runAsUser: { type: MustRunAsRange }
      seLinuxContext: { type: MustRunAs }
      seccompProfiles: [runtime/default]
      supplementalGroups: { type: RunAsAny }
      userNamespaceLevel: AllowHostLevel
      volumes: [configMap, csi, downwardAPI, emptyDir, ephemeral, image, persistentVolumeClaim, projected, secret]

- name: platform | ClusterRole use-agent-office-imagevol-scc and the platform namespace binding
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: { name: use-agent-office-imagevol-scc }
      rules:
        - { apiGroups: [security.openshift.io], resources: [securitycontextconstraints], resourceNames: [agent-office-imagevol], verbs: [use] }
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: { name: agent-office-imagevol-default-sa, namespace: "{{ ocp4_workload_software_factory_namespace }}" }
      roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: use-agent-office-imagevol-scc }
      subjects: [{ kind: ServiceAccount, name: default, namespace: "{{ ocp4_workload_software_factory_namespace }}" }]
  loop_control: { label: "{{ item.kind }}" }

# --- OpenShift group of the attendees (Argo CD RBAC and anything keyed on cluster groups)
- name: platform | OpenShift group {{ workshop_openshift_group }} with user1..N
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: user.openshift.io/v1
      kind: Group
      metadata: { name: "{{ workshop_openshift_group }}" }
      users: "{{ range(1, num_users | int + 1) | map('regex_replace', '^(.*)$', keycloak_user_prefix ~ '\\1') | list }}"

# --- the operator (only once its catalog is reachable)
- name: platform | operator catalog not set; operator, console plugin and seats' gateways wait for it
  ansible.builtin.debug:
    msg: "agent_office_catalog_image is empty: skipping the operator-dependent part of the platform"
  when: agent_office_catalog_image | length == 0

- name: platform | operator-dependent pieces
  when: agent_office_catalog_image | length > 0
  block:
    - name: platform | wait for the operator CSV
      ansible.builtin.include_tasks: wait_for_csv.yml
      vars:
        csv_operator: agent-office-operator
        csv_namespace: agent-office-operator

    # OLM installs the bundle's Service under the kustomize-prefixed name
    # (agent-office-operator-agent-office-backstage-catalog); the Developer Hub proxy
    # entries of the binders plugin target agent-office-backstage-catalog, the name the
    # reference cluster carries as a second Service. Same selector, same port.
    - name: platform | catalog Service under the name the Developer Hub proxy targets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: agent-office-backstage-catalog
            namespace: agent-office-operator
            labels: { app.kubernetes.io/component: backstage-catalog, app.kubernetes.io/name: agent-office-operator }
          spec:
            ports: [{ name: http, port: 80, protocol: TCP, targetPort: backstage-cat }]
            selector: { app.kubernetes.io/name: agent-office-operator, control-plane: controller-manager }

    - name: platform | console plugin (Service, Deployment, ConsolePlugin)
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - apiVersion: v1
          kind: Service
          metadata:
            name: agent-office-plugin
            namespace: agent-office-operator
            labels: { app: agent-office-plugin }
            annotations: { service.beta.openshift.io/serving-cert-secret-name: agent-office-plugin-serving-cert }
          spec:
            selector: { app: agent-office-plugin }
            ports: [{ name: https, port: 9001, targetPort: 9001, protocol: TCP }]
            type: ClusterIP
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: agent-office-plugin
            namespace: agent-office-operator
            labels: { app: agent-office-plugin }
          spec:
            replicas: 1
            selector: { matchLabels: { app: agent-office-plugin } }
            template:
              metadata: { labels: { app: agent-office-plugin } }
              spec:
                containers:
                  - name: agent-office-plugin
                    image: "{{ agent_office_console_plugin_image }}"
                    imagePullPolicy: IfNotPresent
                    ports: [{ containerPort: 9001, protocol: TCP }]
                    resources:
                      requests: { cpu: 10m, memory: 64Mi }
                      limits: { cpu: 200m, memory: 256Mi }
                    volumeMounts: [{ name: serving-cert, mountPath: /etc/serving-cert, readOnly: true }]
                volumes:
                  - name: serving-cert
                    secret: { secretName: agent-office-plugin-serving-cert, defaultMode: 420 }
        - apiVersion: console.openshift.io/v1
          kind: ConsolePlugin
          metadata: { name: agent-office-plugin }
          spec:
            displayName: Agent Office Plugin
            proxy:
              - alias: catalog
                authorization: None
                endpoint:
                  type: Service
                  service: { name: agent-office-plugin, namespace: agent-office-operator, port: 9001 }
            i18n: { loadType: Preload }
            backend:
              type: Service
              service: { name: agent-office-plugin, namespace: agent-office-operator, port: 9001, basePath: / }
      loop_control: { label: "{{ item.kind }}" }

    - name: "platform | console operator: enabled plugins"
      kubernetes.core.k8s_info:
        api_version: operator.openshift.io/v1
        kind: Console
        name: cluster
      register: r_console

    - name: platform | enable the plugin in the console
      kubernetes.core.k8s_json_patch:
        api_version: operator.openshift.io/v1
        kind: Console
        name: cluster
        patch:
          - op: add
            path: /spec/plugins/-
            value: agent-office-plugin
      when: "'agent-office-plugin' not in (r_console.resources[0].spec.plugins | default([]))"

    - name: platform | ready
      ansible.builtin.debug:
        msg: "operator from {{ agent_office_catalog_image }} ready; console plugin {{ agent_office_console_plugin_image }} enabled"
