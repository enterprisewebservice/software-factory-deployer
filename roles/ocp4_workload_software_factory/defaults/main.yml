---
# ocp4_workload_software_factory — defaults
ACTION: provision
num_users: 5
ocp4_workload_software_factory_namespace: agent-office

# Model access: attendees' agents consume models via OpenShift AI Models-as-a-Service.
model_access: maas                    # maas (only supported mode today)
maas_external_provider_url: ""        # external model endpoint MaaS brokers (from RHDP attrs/secret)
maas_external_provider_secret: ""     # per-order secret name carrying the provider key (never in git)
sovereign_vllm: false                 # also serve an in-cluster model and register it in MaaS (M7)
sovereign_vllm_model: ""              # model id when sovereign_vllm is true (GPU node required)

# agent-office operator (values from the reference cluster)
agent_office_catalog_image: ""        # the chart pins it: quay.io/dpeterso/agent-office-operator-catalog:<tag>
agent_office_channel: alpha

# Brain stage (model_desk): the facilitator's Claude lane. The Vertex credential Secret
# (model-desk-gcp-adc/adc.json) is the guide's first step; the rest is automated.
model_desk_namespace: model-desk
model_desk_image: ghcr.io/berriai/litellm@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
claude_vertex_project: itpc-gcp-global-revenue-claude
claude_vertex_location: global
claude_models:                              # newest permitted first; the hiring form picks the first
  # Swept live on the work project on 13 Oct 2026 (rawPredict): opus-5, opus-4-8, sonnet-5,
  # opus-4-6 answer; sonnet-5-1/5-5, opus-5-5, fable-5/5-1, opus-4-7 are 404 (not enabled).
  - { id: claude-opus-5, name: "Claude Opus 5" }
  - { id: claude-sonnet-5, name: "Claude Sonnet 5" }
  - { id: claude-opus-4-8, name: "Claude Opus 4.8" }
  - { id: claude-opus-4-6, name: "Claude Opus 4.6" }
mcp_gateway_channel: preview
eso_channel: stable

# Developer Hub
rhdh_namespace: rhdh

# Developer Hub sign-in page. Workshop clusters show ONLY Keycloak (attendees land straight
# on the realm login). Mixed/reference clusters set a list, e.g. ['github', 'oidc'], which
# RHDH renders as a multi-provider picker (signInPage accepts a list — verified on 1.9).
rhdh_sign_in_page: oidc

# The golden-path template source. No workshop fork needed: the genesis
# template routes per-hire in place (gitProvider: auto) —
# rhdh_gitea_templates.yml mirrors this repo@revision into the in-cluster
# Gitea and sets exactly one default (giteaHost) at registration time.
rhdh_golden_path_template_repo: "https://github.com/deanpeterson/tssc-dev-multi-ci.git"
rhdh_golden_path_template_revision: devspaces-workspace-for-agents  # TODO: pin to a tag/sha per workshop release

# Git provider for attendee agent repos: in-cluster Gitea (per-user ORGS — both
# publish:gitea and Argo CD's gitea scmProvider are org-only, so "the user's
# namespace" is an org the attendee owns: <user><gitea_user_org_suffix>). The
# reference cluster keeps its GitHub wiring; workshop clusters never touch it.
# BOTH providers stay live simultaneously: the genesis template's hidden
# gitProvider parameter ships as 'auto' (per-hire verdict — Keycloak-
# ingested attendees route to Gitea, everyone else stays on GitHub), and
# rhdh_gitea_templates.yml sets exactly ONE default at registration time
# (giteaHost). Discovery is a SECOND ApplicationSet next to the GitHub one.
git_provider: gitea
gitea_namespace: gitea
gitea_admin_user: opentlc-mgr
gitea_host: ""                                  # gitea route host (no scheme); derived from the Route by gitea.yml when empty
gitea_user_org_suffix: "-agents"                # org per attendee: user1-agents, user2-agents, …
gitea_scm_secret_name: agent-office-gitea-scm   # token Secret (openshift-gitops) for the ApplicationSet gitea generators
gitea_rhdh_secret_name: rhdh-gitea-credentials  # username/password Secret (RHDH ns) for publish:gitea
gitea_templates_org: workshop-config            # org holding the deployer-rewritten template mirror
gitea_templates_repo: software-templates
# Gitea scaffolder actions module (publish:gitea). RHDH's bundled dist has no
# gitea module (github/gitlab only — checked in the 1.9.2 image), so it loads
# from the rhdh-plugin-export-overlays OCI registry; bs_1.45.3 matches the
# stream the reference cluster's other OCI plugins already use.
rhdh_gitea_scaffolder_plugin: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-scaffolder-backend-module-gitea:bs_1.45.3__0.2.15!backstage-plugin-scaffolder-backend-module-gitea"

# GitOps bootstrap
gitops_bootstrap_repo: ""             # TODO: workshop-config repo (subset of agent-office/cluster)
gitops_bootstrap_revision: main

# Keycloak
keycloak_realm: workshop
keycloak_user_prefix: user
keycloak_user_password: ""            # generated per-order (lookup('password', ...)) — never static

# Stage selection. A list, or a comma-separated string when passed as an extra-var (the Field
# Content Job does that). The first RHDP order runs: operators,showroom,userinfo
software_factory_stages: [operators, gitea, gitops, keycloak_users, rhdh, agent_platform, rhoai_maas, mattermost, quay, seats, mcp_gateway, model_desk, showroom, verify, userinfo]
cluster_domain: ""                    # derived from ingresses.config.openshift.io/cluster when empty

# Showroom: one lab guide per seat (user1..N), the RHDP multi-user model
showroom_content_repo: https://github.com/enterprisewebservice/showroom-openshift-software-factory.git
showroom_content_ref: main
showroom_seat_mode: static            # the guide's {seat_mode} attribute

# RHDP userinfo ConfigMap (demo.redhat.com/userinfo) lands in the Job's namespace on RHDP
userinfo_namespace: "{{ runner_namespace | default(namespace | default(ocp4_workload_software_factory_namespace, true), true) }}"

# Gitea install (RHPDS gitea-operator; same operator as the reference cluster)
gitea_catalog_image: quay.io/rhpds/gitea-catalog
gitea_catalog_image_tag: v2.1.0
gitea_operator_channel: stable
gitea_image: quay.io/rhpds/gitea
gitea_image_tag: "1.24.6"
# Gitea's data directory is the container filesystem on this operator's pod; repository archives
# (what the scaffolder's fetch:template downloads) live there and vanish on restart while the
# database keeps their records, so they go on the repositories volume instead.
gitea_repo_archive_path: /gitea-repositories/.repo-archive
workshop_user_password: ""            # generated per order (workshop_password.yml) unless keycloak_user_password is set

# Keycloak (RHDP base provides it; the chart passes the admin credentials)
keycloak_url: ""                      # https://sso.<apps domain>, from the chart
keycloak_admin_secret: ""             # Secret in the runner namespace: adminUser/adminPassword
keycloak_realm_fallback: sso          # used only if no realm holds user1
workshop_attendees_group: attendees   # Keycloak group; Developer Hub RBAC and ModelConnection access key on it
rhdh_host: "devhub.{{ cluster_domain }}"
maas_external_provider_model: ""

# Developer Hub (Helm chart, as on the reference cluster)
rhdh_release: rhdh
rhdh_chart_version: "1.9.2"
rhdh_super_user: admin                # the base's admin user, present in the Keycloak realm
rhdh_custom_plugins: false            # the workshop's own plugins at quay.io/dpeterso; true once those repos are public
rhdh_operator_catalog: false          # register the operator's Backstage catalog once the operator is installed
keycloak_realm: "{{ keycloak_realm_fallback }}"

# Agent platform
agent_office_console_plugin_image: quay.io/dpeterso/agent-office-plugin:v0.0.7
openclaw_image: quay.io/dpeterso/openclaw:v2026.7.1   # rewritten into the mirrored hire template; same tag as the operator default
agent_registry_urls: https://mindifact.ai/v1/index.json
workshop_openshift_group: redhat-workshop-users

# Chat (Mattermost)
mattermost_host: "mattermost-mattermost.{{ cluster_domain }}"
mattermost_admin_user: agentadmin
bridge_guardrails_url: ""             # no guardrails service on a workshop cluster: the bridge relays unguarded
bridge_guardrails_fail_closed: "false"

# --- The cluster's own registry (Red Hat Quay) and the supply-chain lane -------------------
# Module 4 inspects skill artifacts in "the cluster's own container registry" and Module 6
# pushes the dev agent's image there, where Tekton Chains signs it. The operators stage
# subscribes the Quay operator and creates the instance (postgres, redis, a NooBaa bucket,
# route and TLS all operator-managed) so it initialises while the other stages run; the quay
# stage waits for it, creates the superuser, one organization, the robot accounts, mirrors the
# workshop's skill artifacts from their public home and keys Tekton Chains.
quay_operator_channel: stable-3.18
quay_namespace: registry
quay_registry_name: quay                # managed route host: <name>-quay-<namespace>.<cluster_domain>
quay_org: workshop                      # one organization: mirrored artifacts and every seat's images
quay_superuser: quayadmin
quay_clair: false                       # Clair (vulnerability scanning) pods; the lab's scans run in the pipeline
quay_registry_endpoint_timeout: 1800    # seconds to wait for the registry endpoint
artifact_mirror_source: quay.io/dpeterso    # public home of the workshop's skill artifacts (digests preserved)
artifact_mirror_repos:
  - agent-office-skill-platform-incident-triage
  - agent-office-pack-supply-chain-ops
  - agent-office-skill-golden-path-service
skopeo_image: quay.io/skopeo/stable@sha256:97772f3c64fd2fba720b2bafaf37239dc44d8b1c625c8383c64044832efe9ed9   # v1.22.3
pipelines_namespace: openshift-pipelines
cosign_python: python3                  # interpreter carrying cryptography + pynacl (the Job installs both)
# The guide's defaults when the registry stage did not run (the reference cluster's values).
reference_artifact_registry: quay-quay-quay-test.apps.salamander.aimlworkbench.com
reference_registry_org: deanpeterson
