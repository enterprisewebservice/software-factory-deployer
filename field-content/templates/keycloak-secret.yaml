{{- if and .Values.keycloak .Values.keycloak.adminPassword }}
---
# RHDP injects keycloak.{adminUser,adminPassword,consoleUrl} for the base's Red Hat build of
# Keycloak. The password goes into a Secret the workload reads, never onto a command line.
apiVersion: v1
kind: Secret
metadata:
  name: field-content-keycloak
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ansible-runner.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
type: Opaque
stringData:
  adminUser: {{ .Values.keycloak.adminUser | quote }}
  adminPassword: {{ .Values.keycloak.adminPassword | quote }}
  consoleUrl: {{ .Values.keycloak.consoleUrl | quote }}
{{- end }}
