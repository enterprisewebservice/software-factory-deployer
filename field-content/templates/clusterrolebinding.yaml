{{- if .Values.rbac.create }}
---
# The workload creates namespaces, CatalogSources, Subscriptions, OAuth/IdP configuration and
# SCC bindings, so the Job runs as cluster-admin. The Field Content Argo controller is
# cluster-admin itself and may grant this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ansible-runner.fullname" . }}
  labels:
    {{- include "ansible-runner.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace.name }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
