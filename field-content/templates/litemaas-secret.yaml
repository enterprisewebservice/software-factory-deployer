{{- if and .Values.litemaas .Values.litemaas.enabled }}
---
# RHDP injects litemaas.{apiUrl,apiKey,model} when the catalog item provisions a LiteMaaS
# virtual key. The key goes into a Secret, never onto the Job's command line.
apiVersion: v1
kind: Secret
metadata:
  name: field-content-litemaas
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ansible-runner.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
type: Opaque
stringData:
  apiUrl: {{ .Values.litemaas.apiUrl | quote }}
  apiKey: {{ .Values.litemaas.apiKey | quote }}
  model: {{ .Values.litemaas.model | quote }}
{{- end }}
